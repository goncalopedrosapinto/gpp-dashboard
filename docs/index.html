<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="GPP">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="format-detection" content="telephone=no">
<meta name="description" content="Os meus gastos e ganhos, contas partilhadas e despesas fixas.">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<title>GPP Dashboard</title>
<style>
/* Regras de UI: ibelick/ui-skills (baseline-ui + fixing-accessibility), adaptadas a CSS sem Tailwind */
:root{
  --bg:#f2f2f7; --card:#ffffff; --text:#000000; --muted:#6c6c70; --line:rgb(60 60 67 / .18);
  --accent:#0060df; --pos:#137a3f; --neg:#c62d22; --chip:#e5e5ea; --segon:#ffffff;
  --warn-bg:#fff1cc; --warn-text:#7a4f00; --press:#e5e5ea; --skel:#e5e5ea; --on-accent:#ffffff; --logo:#ea580c;
  /* escala fixa de z-index */
  --z-header:10; --z-tabbar:20; --z-toast:40;
  /* escala de sombras (valores por defeito do Tailwind) */
  --shadow-sm:0 1px 2px 0 rgb(0 0 0 / .05);
  --shadow:0 1px 3px 0 rgb(0 0 0 / .1),0 1px 2px -1px rgb(0 0 0 / .1);
  --shadow-lg:0 10px 15px -3px rgb(0 0 0 / .1),0 4px 6px -4px rgb(0 0 0 / .1);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#000000; --card:#1c1c1e; --text:#ffffff; --muted:#98989f; --line:rgb(84 84 88 / .65);
    --accent:#4da3ff; --pos:#32d26a; --neg:#ff6259; --chip:#2c2c2e; --segon:#636366;
    --warn-bg:#3d2f0a; --warn-text:#ffd27a; --press:#2c2c2e; --skel:#2c2c2e; --on-accent:#000000;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none !important}
html,body{margin:0;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif;
  font-size:17px;line-height:1.3;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
body{min-height:100dvh}
body.noscroll{overflow:hidden}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:16px} /* abaixo de 16px o iPhone faz zoom ao focar */
h1,h2,h3,.stitle{text-wrap:balance}
p,.hint{text-wrap:pretty}
.num{font-variant-numeric:tabular-nums}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}

/* Foco visível (teclado) */
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ginput:focus-visible,.valorin:focus-visible,.lfield:focus-visible{outline:none}
.grow:has(.ginput:focus-visible){box-shadow:inset 0 0 0 2px var(--accent)}
.valorin:focus-visible{box-shadow:0 2px 0 0 var(--accent)}
.lfield:focus-visible{box-shadow:0 0 0 2px var(--accent)}
.lrow:focus-visible{outline-offset:-2px}

/* Cabeçalho */
.top{position:sticky;top:0;z-index:var(--z-header);padding:calc(env(safe-area-inset-top, 0px) + 12px) 16px 8px;
  background:color-mix(in srgb,var(--bg) 86%,transparent);
  -webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px)}
.top h1{font-size:34px;font-weight:700;margin:0;line-height:1.15}
.toprow{display:flex;align-items:center;justify-content:space-between;gap:12px}
.acts{display:flex;align-items:center;gap:10px}
.addbtn{flex:none;width:38px;height:38px;border-radius:19px;border:0;background:var(--accent);color:var(--on-accent);font-size:26px;line-height:38px;padding:0 0 2px;box-shadow:var(--shadow)}
.gearbtn{flex:none;width:38px;height:38px;border-radius:19px;border:0;background:var(--chip);color:var(--accent);display:grid;place-items:center;padding:0}
.gearbtn svg{width:20px;height:20px}
.mesnav{display:flex;align-items:center;gap:2px;margin-top:4px}
.navbtn{background:none;border:0;color:var(--accent);font-size:30px;line-height:1;padding:0 10px 4px;margin-left:-10px}
.navbtn+.mesnome{margin-left:-6px}
.navbtn:disabled{opacity:.3}
.mesnome{font-size:17px;font-weight:600;min-width:8.6em;text-align:center}
.link{background:none;border:0;color:var(--accent);font-size:17px;padding:8px 0}
.link.b{font-weight:600}
.link.small{font-size:15px;margin-left:auto;padding:4px 0}
.link.small2{font-size:15px;padding:4px 0;flex:none}
.linha-acoes{display:flex;justify-content:flex-end;gap:22px;margin:4px 16px 0}
select.ginput{-webkit-appearance:none;appearance:none;text-align:right;text-align-last:right;color:var(--accent);cursor:pointer}
.rval.neg,.big.neg{color:var(--neg)}
.link:disabled{opacity:.4}

main{max-width:640px;margin:0 auto;padding:0 16px calc(104px + env(safe-area-inset-bottom, 0px))}

/* Secções agrupadas, estilo iOS */
.glabel{font-size:13px;font-weight:400;color:var(--muted);text-transform:uppercase;margin:22px 16px 7px}
main > .glabel:first-child,main > .chips + .glabel{margin-top:8px}
.group{background:var(--card);border-radius:12px;overflow:hidden}
ul.group{list-style:none;margin:0;padding:0}
ul.group > li:not(:last-child){border-bottom:.5px solid var(--line)}
.grow{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:46px;padding:6px 16px;border-bottom:.5px solid var(--line)}
.grow:last-child{border-bottom:0}
.glab{flex:none}
.grow:has([aria-invalid="true"]) .glab{color:var(--neg)}
.gval{color:var(--muted);text-align:right}
.gval.strong{color:var(--text);font-weight:600}
.ginput{flex:1;min-width:0;border:0;background:transparent;color:var(--text);font-size:17px;text-align:right;padding:8px 0}
.ginput::placeholder{color:var(--muted);opacity:.7}
.pad{padding:12px 16px}
.hint{font-size:13px;color:var(--muted);margin:7px 16px 0;line-height:1.4}
.hint.warn{color:var(--warn-text)}
.hint.center{text-align:center;margin:0 0 14px}
.empty{text-align:center;color:var(--muted);margin:48px 16px}
.empty p{margin:0}
.empty .btn{display:inline-block;width:auto;padding:12px 22px;margin-top:16px}

/* Destaques */
.hero{padding:14px 16px 16px}
.hero .k{font-size:15px;color:var(--muted)}
.big{font-size:36px;font-weight:700;margin-top:2px;font-variant-numeric:tabular-nums}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.duo .big{font-size:26px}
.pos{color:var(--pos)}
.neg{color:var(--neg)}
.pill{display:inline-block;margin-top:10px;padding:4px 10px;border-radius:12px;font-size:13px;font-weight:600}
.pill.warn{background:var(--warn-bg);color:var(--warn-text)}

/* Linhas de lista */
.lrow{display:flex;align-items:center;gap:12px;width:100%;padding:10px 16px;background:none;border:0;
  border-bottom:.5px solid var(--line);text-align:left;color:inherit;font:inherit}
.lrow:last-child{border-bottom:0}
button.lrow:active{background:var(--press)}
.lrow.off{opacity:.55}
.rmain{flex:1;min-width:0}
.rtitle{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rsub{font-size:13px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rsub.warn{color:var(--warn-text)}
.rval{font-weight:600;white-space:nowrap;font-variant-numeric:tabular-nums}
.rval.pos{color:var(--pos)}
.chev{color:var(--muted);opacity:.5;font-size:20px;margin-left:-4px}
.mini{flex:none;border:0;background:var(--accent);color:var(--on-accent);font-weight:600;font-size:14px;padding:6px 12px;border-radius:14px}
.linkrow{flex:1;min-width:0;background:none;border:0;padding:0;text-align:left;color:inherit;font:inherit}
.catrow{padding:10px 16px}
.cattop{display:flex;justify-content:space-between;gap:12px}
.bar{height:6px;border-radius:3px;background:var(--accent);margin-top:7px;min-width:4px}
.uso{height:4px;border-radius:2px;background:var(--chip);margin-top:6px;overflow:hidden}
.uso i{display:block;height:100%;background:var(--accent);border-radius:2px}
.uso i.alto{background:var(--neg)}
.datahora{gap:8px}
.datahora .ginput[type=date]{flex:1.4}

/* Esqueletos de carregamento (estáticos) */
.skel{background:var(--card);border-radius:12px;padding:6px 16px;margin-top:22px}
.skel i{display:block;height:13px;border-radius:7px;background:var(--skel);margin:12px 0;width:80%}
.skel i.w40{width:40%}
.skel i.w60{width:60%}
.skel i.big{height:32px;width:50%;border-radius:10px}

/* Controlos */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;margin:8px -16px 0;padding:0 16px 2px;scrollbar-width:none}
.chips.scroll::-webkit-scrollbar{display:none}
.chip{flex:none;padding:7px 13px;border-radius:17px;background:var(--chip);border:0;font-size:15px;color:var(--text)}
.chip.on,.chip[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.switch{-webkit-appearance:none;appearance:none;width:51px;height:31px;border-radius:16px;background:var(--chip);position:relative;flex:none;margin:0;transition:background-color .15s ease-out}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:var(--shadow);transition:transform .15s ease-out}
.switch:checked{background:var(--accent)}
.switch:checked::after{transform:translateX(20px)}
.inline{display:flex;align-items:center;justify-content:flex-end;gap:12px;flex:1;min-width:0}
.btn{display:block;width:100%;padding:14px;border-radius:12px;border:0;font-size:17px;font-weight:600;margin:12px 0 0}
.btn.primary{background:var(--accent);color:var(--on-accent)}
.btn.ghost{background:var(--card);color:var(--accent)}
.btn.danger{background:var(--card);color:var(--neg);margin-top:22px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.valorin{display:block;width:100%;font-size:46px;font-weight:700;text-align:center;border:0;background:transparent;color:var(--text);padding:8px 0 2px;font-variant-numeric:tabular-nums}
.valorin::placeholder{color:var(--muted);opacity:.45}
.valorin.pos{color:var(--pos)}
.valorin[aria-invalid="true"]{color:var(--neg)}
.split{text-align:center;color:var(--muted);font-size:15px;margin:0 0 16px;font-variant-numeric:tabular-nums}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
ol.steps{margin:0;padding:12px 16px 12px 36px;font-size:15px;line-height:1.45}
ol.steps li{margin:0 0 7px}
ol.steps li:last-child{margin:0}
ol.steps b{font-weight:600}

/* Barra de separadores */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:var(--z-tabbar);display:grid;grid-template-columns:repeat(5,1fr);
  padding:6px 0 calc(env(safe-area-inset-bottom, 0px) + 4px);border-top:.5px solid var(--line);
  background:color-mix(in srgb,var(--card) 88%,transparent);
  -webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px)}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;font-weight:500;color:var(--muted);background:none;border:0;padding:3px 0}
.tab svg{width:26px;height:26px}
.tab.on{color:var(--accent)}

/* Folha de edição: <dialog> nativo (foco preso, Escape fecha) */
dialog.sheet{position:fixed;inset:auto 0 0 0;margin:0 auto;width:100%;max-width:640px;max-height:92dvh;padding:0;border:0;
  border-radius:14px 14px 0 0;background:var(--bg);color:var(--text);overflow-y:auto;-webkit-overflow-scrolling:touch;box-shadow:var(--shadow-lg)}
dialog.sheet::backdrop,dialog.alert::backdrop{background:rgb(0 0 0 / .4)}
.sheet-in{padding:6px 16px calc(env(safe-area-inset-bottom, 0px) + 20px)}
.grab{width:36px;height:5px;border-radius:3px;background:var(--line);margin:2px auto 4px}
.snav{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;margin-bottom:4px}
.snav .link:first-child{justify-self:start}
.snav .r{justify-self:end}
.stitle{font-size:17px;font-weight:600;margin:0}
.sheet-in .group{margin-bottom:18px}
.sheet-in .glabel{margin-top:0}
.ferr{color:var(--neg);font-size:15px;font-weight:600;margin:4px 0 12px;text-align:center}

/* Confirmação para ações destrutivas */
dialog.alert{border:0;border-radius:14px;padding:20px 16px 14px;width:min(300px,calc(100% - 32px));background:var(--card);color:var(--text);text-align:center;box-shadow:var(--shadow-lg)}
.alert h2{font-size:17px;font-weight:600;margin:0 0 6px}
.alert p{margin:0 0 16px;color:var(--muted);font-size:15px}
.acts2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.acts2 button{padding:12px;border-radius:10px;border:0;font-size:17px;background:var(--chip);color:var(--text)}
.acts2 .danger{background:var(--neg);color:#fff;font-weight:600}

/* Entrada */
.login{max-width:380px;margin:0 auto;padding:calc(env(safe-area-inset-top, 0px) + 16vh) 24px 40px;display:flex;flex-direction:column;gap:12px}
.login h1{font-size:30px;margin:6px 0 0}
.login > p{margin:0 0 14px;color:var(--muted)}
.logo{width:72px;height:72px;border-radius:18px;background:var(--logo);color:#fff;font-weight:800;font-size:23px;display:grid;place-items:center}
.lfield{font-size:17px;padding:14px 16px;border-radius:12px;border:0;background:var(--card);color:var(--text)}
.lfield[aria-invalid="true"]{box-shadow:0 0 0 2px var(--neg)}
.lerr{color:var(--neg);font-size:15px;font-weight:600;margin:0}

/* Visto de pago */
.visto{flex:none;width:28px;height:28px;margin:-8px;padding:0;box-sizing:content-box;border:8px solid transparent;background-clip:padding-box;
  border-radius:50%;box-shadow:inset 0 0 0 2px var(--muted);background-color:transparent;color:var(--on-accent);display:grid;place-items:center;transition:transform 100ms ease-out}
.visto.on{background-color:var(--pos);box-shadow:none}
.visto svg{width:18px;height:18px;stroke-width:2.6}
.visto:active{transform:scale(0.92)}
.rvals{text-align:right;flex:none}
.rvals .rsub{margin-top:1px}
.codigo{font-size:40px;font-weight:700;text-align:center;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;margin:14px 0 2px}
.pad0{margin:10px 0 0}
.pad0 .btn{width:100%}

/* PIN */
.pin{max-width:340px;margin:0 auto;padding:calc(env(safe-area-inset-top, 0px) + 5vh) 24px calc(env(safe-area-inset-bottom, 0px) + 16px);display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px}
.pin h1{font-size:24px;margin:0}
.pin-sub{margin:0;color:var(--muted);min-height:2.6em}
.pin-pontos{display:flex;gap:18px;margin:12px 0 2px}
.pin-pontos i{width:14px;height:14px;border-radius:7px;border:1.5px solid var(--text)}
.pin-pontos i.on{background:var(--text)}
.pin-pontos.erro i{border-color:var(--neg)}
.pin-erro{color:var(--neg);font-size:15px;font-weight:600;margin:0;min-height:1.4em}
.pin-teclado{display:grid;grid-template-columns:repeat(3,72px);gap:12px 24px;margin:4px 0 4px}
.pin-tecla{width:72px;height:72px;border-radius:36px;border:0;background:var(--card);color:var(--text);font-size:30px;box-shadow:var(--shadow-sm)}
.pin-tecla.txt{background:none;box-shadow:none;font-size:17px;color:var(--accent)}
.pin-tecla:active{transform:scale(0.97);background:var(--press)}
body.privado #app{visibility:hidden}

#toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom, 0px));z-index:var(--z-toast);transform:translate(-50%,8px);
  max-width:calc(100% - 32px);padding:10px 16px;border-radius:20px;background:rgb(28 28 30 / .94);color:#fff;font-size:15px;
  opacity:0;pointer-events:none;transition:opacity .15s ease-out,transform .15s ease-out;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
#toast.bad{background:#b3261e}


/* Agenda */
:root{--ag-pessoal:#0060df;--ag-trabalho:#b45309;--ag-bia:#be185d;--ag-outro:#6b7280;--ag-pag:#137a3f}
@media (prefers-color-scheme: dark){:root{--ag-pessoal:#4da3ff;--ag-trabalho:#f59e0b;--ag-bia:#f472b6;--ag-outro:#9ca3af;--ag-pag:#32d26a}}
.ag-pessoal{--c:var(--ag-pessoal)} .ag-trabalho{--c:var(--ag-trabalho)} .ag-bia{--c:var(--ag-bia)} .ag-outro{--c:var(--ag-outro)} .ag-pag{--c:var(--ag-pag)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--c);flex:none}
.chip .dot{margin-right:6px;vertical-align:1px}
.chip[aria-pressed="true"] .dot{box-shadow:0 0 0 2px var(--on-accent)}
.cal-wrap{padding:8px 8px 10px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.cal-dow{font-size:12px;color:var(--muted);text-align:center;padding:4px 0 6px;text-transform:uppercase}
.cal-dia{display:flex;flex-direction:column;align-items:center;gap:3px;min-height:46px;padding:6px 0 4px;border:0;border-radius:10px;background:none;color:var(--text);font-size:16px;font-variant-numeric:tabular-nums}
.cal-dia.hoje .cal-num{color:var(--accent);font-weight:700}
.cal-dia[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.cal-dia[aria-pressed="true"] .cal-num{color:var(--on-accent)}
.cal-dia[aria-pressed="true"] .dot{box-shadow:0 0 0 1.5px var(--on-accent)}
.cal-pontos{display:flex;gap:3px;min-height:6px}
.cal-pontos .dot{width:6px;height:6px}
.legenda{display:flex;flex-wrap:wrap;gap:6px 14px;margin:10px 16px 0;font-size:13px;color:var(--muted)}
.legenda span{display:inline-flex;align-items:center;gap:6px}
.barra{width:4px;align-self:stretch;border-radius:2px;background:var(--c);flex:none;margin:2px 0}
input[type="time"].ginput,input[type="date"].ginput{min-height:34px}


/* mobile-native (Emil Kowalski): o que separa um site de uma app instalada no iPhone */
html,body{overscroll-behavior:none}                 /* sem "elástico" da página inteira */
dialog.sheet{overscroll-behavior:contain}           /* a folha faz scroll sem arrastar a página */
.chips.scroll{overscroll-behavior-x:contain}
button,a,[role="button"],.chip,.tab,.cal-dia{       /* toque imediato; sem seleção nem menu ao manter premido */
  touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.btn,.addbtn,.gearbtn,.mini,.chip,.cal-dia,.seg button,.acts2 button{transition:transform 100ms ease-out}
.btn:active,.addbtn:active,.gearbtn:active,.mini:active,.chip:active,.cal-dia:active,.seg button:active,.acts2 button:active{transform:scale(0.97)}
.btn:disabled:active{transform:none}
.link:active,.navbtn:active,.tab:active{opacity:.6}
.top,main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.tabbar{padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}

/* Valor inválido num campo (marcado ao sair do campo) */
.valorin[aria-invalid="true"],.ginput[aria-invalid="true"]{color:var(--neg)}

/* Alvos de toque ≥ 44px sem mudar o desenho: área invisível, só em ecrãs táteis */
@media (pointer:coarse){
  .link,.mini,.chip,.gearbtn,.addbtn,.navbtn,.linkrow{position:relative}
  .link::after,.mini::after,.chip::after,.gearbtn::after,.addbtn::after,.navbtn::after,.linkrow::after,.switch::before{content:"";position:absolute}
  .link::after{inset:-4px -2px}
  .link.small::after,.link.small2::after{inset:-10px -4px}
  .mini::after{inset:-8px -4px}
  .chip::after{inset:-6px -2px}
  .gearbtn::after,.addbtn::after{inset:-3px}
  .navbtn::after{inset:-6px}
  .linkrow::after{inset:-10px 0}                   /* a linha toda abre o item, não só o texto */
  .switch::before{inset:-7px -4px}
  .grow .ginput{margin:-6px 0;padding:14px 0}     /* o campo ocupa a altura da linha; a linha não muda */
  .pad > .ginput{margin:-4px 0;padding:12px 0}
}

/* Ecrã mais rápido de ler para quem pede menos transparência ou mais contraste */
@media (prefers-reduced-transparency: reduce){
  .top{background:var(--bg);-webkit-backdrop-filter:none;backdrop-filter:none}
  .tabbar{background:var(--card);-webkit-backdrop-filter:none;backdrop-filter:none}
}

function parseNum(s) {
  if (s == null) return null;
  let t = String(s).replace(/[^0-9,.\-]/g, '');

  const neg = t.charAt(0) === '-';

    t = t.split(dec === ',' ? '.' : ',').join('');
    if (t.split(dec).length > 2) return NaN;
    t = t.replace(dec, '.');

      q(sb.from('despesas').select('*').eq('mes', m).order('data', { ascending: false }).order('id', { ascending: false })),
      q(sb.from('despesas').select('*').eq('pago', false).lt('data', m).order('data')),
      q(sb.from('casal_saldos').select('*').order('ordem')),
      q(sb.from('acertos').select('*').order('data', { ascending: false }).order('id', { ascending: false }).limit(30)),
      q(sb.from('eventos').select('*').eq('repete', 'nunca').lte('data', fim).gte('data_fim', m)),
      q(sb.from('eventos').select('*').neq('repete', 'nunca').lte('data', fim))
    ]);
    if (seq !== S.seq) return;
    S.despesas = res[0] || [];
    S.atrasados = res[1] || [];
    const mem = res[2] || [];
    const eu = S.user ? mem.find(x => x.user_id === S.user.id) : null;
    S.casal = eu ? { id: eu.casal_id, eu: eu, outro: mem.find(x => x.membro_id !== eu.membro_id) || null } : null;
    S.acertos = res[3] || [];
    S.eventos = (res[4] || []).concat(res[5] || []);
  } catch (e) { if (seq === S.seq) erro(e); }
  finally { if (seq === S.seq) S.loading = false; }
}

// Movimentos da conta do inquilino: rendas vencidas e despesas cobradas (\u2212), transfer\u00eancias recebidas (+)
function movimentosInquilino(i) {
  const mov = [], hoje = hojeISO();
  for (let m = i.inicio.slice(0, 8) + '01'; m <= mesAtual(); m = addMes(m, 1)) {
    const venc = [m.slice(0, 8) + pad2(Math.min(i.dia_pagamento, ultimoDia(m))), i.inicio].sort()[1];
    if (venc <= hoje) mov.push({ tipo: 'renda', data: venc, titulo: 'Renda de ' + nomeMesCurto(m), valor: -Number(i.renda) });
  }
  S.despImovel.filter(d => d.inquilino_id === i.id).forEach(d => mov.push({ tipo: 'cobranca', d: d, data: d.cobrada_em || d.data,
    titulo: d.descricao || 'Despesa', sub: 'paga por ti ' + (d.data === hoje ? 'hoje' : 'a ' + diaCurto(d.data)), valor: -Number(d.valor) }));
  S.receb.filter(r => r.inquilino_id === i.id).forEach(r => mov.push({ tipo: 'pagamento', r: r, data: r.data,
    titulo: 'Transfer\u00eancia recebida', sub: r.nota, valor: Number(r.valor) }));
  return mov.sort((a, b) => (a.data < b.data ? -1 : a.data > b.data ? 1 : 0));
}
function linhaMovimento(i, x) {
  const abrir = x.tipo === 'pagamento' ? () => abrirPagamento(i, x.r) : x.tipo === 'cobranca' ? () => abrirCobrada(i, x.d) : () => abrirInquilino(i);
  return h('button', { type: 'button', class: 'lrow', onclick: abrir },
    h('div', { class: 'rmain' }, h('div', { class: 'rtitle', text: x.titulo }),
      h('div', { class: 'rsub', text: [diaCurto(x.data), x.tipo === 'cobranca' ? 'cobrada' : null, x.sub].filter(Boolean).join(' \u00b7 ') })),
    h('div', { class: 'rval' + (x.valor > 0 ? ' pos' : ''), text: (x.valor > 0 ? '+' : '\u2212 ') + fmt(Math.abs(x.valor)) }),
    h('span', { class: 'chev', text: '\u203a', 'aria-hidden': 'true' }));
}
function viewInquilinos() {

  if (!S.imoveis.length) return [vazio('Regista o inquilino de cada im\u00f3vel, o que ele tem de pagar e o que te transferiu. A app faz o saldo e o balan\u00e7o do im\u00f3vel.', 'Configurar im\u00f3vel', () => abrirImovel(null))];
  const im = imovelAtual(), m = S.mes, ano = m.slice(0, 4), i = inquilinoDe(im);
  const out = [h('div', { class: 'chips scroll', role: 'group', 'aria-label': 'Im\u00f3vel' }, S.imoveis.map(x => h('button', {
    type: 'button', class: 'chip', text: x.nome, 'aria-pressed': String(x.id === S.imovelSel), onclick: async () => { S.imovelSel = x.id; await carregarImoveis(); render(); }
  })))];
  if (!i) {
    out.push(vazio(im.nome + ' ainda n\u00e3o tem inquilino: o nome, a data de in\u00edcio e a renda.', 'Adicionar inquilino', () => abrirInquilino(null)),
      h('div', { class: 'linha-acoes' }, h('button', { type: 'button', class: 'link b', text: 'Editar im\u00f3vel', onclick: () => abrirImovel(im) }), novoImovel));

  const mov = movimentosInquilino(i), saldo = r2(soma(mov, x => x.valor));   // negativo = deve
  out.push(group(h('div', { class: 'hero' },
    h('div', { class: 'k', text: i.nome + ' \u00b7 ' + desdeTxt(i.inicio) + ' \u00b7 renda ' + fmt(i.renda) }),
    h('div', { class: 'big ' + (saldo < -0.005 ? 'neg' : 'pos'), text: saldo < -0.005 ? 'Deve ' + fmt(-saldo) : saldo > 0.005 ? 'A cr\u00e9dito ' + fmt(saldo) : 'Tem tudo pago' }),
    h('button', { type: 'button', class: 'btn primary', text: 'Recebi uma transfer\u00eancia', onclick: () => abrirPagamento(i, null, saldo < 0 ? -saldo : null) }),
    h('div', { class: 'linha-acoes', style: 'margin:8px 0 0' },
      h('button', { type: 'button', class: 'link b', text: 'Cobrar despesa', onclick: () => abrirCobranca(i) }),
      h('button', { type: 'button', class: 'link b', text: 'Editar', 'aria-label': 'Editar inquilino ' + i.nome, onclick: () => abrirInquilino(i) })))));
  out.push(hint('Saldo = rendas vencidas + despesas cobradas \u2212 transfer\u00eancias recebidas, desde o in\u00edcio do contrato.'));
  const doMes = mov.filter(x => x.data.slice(0, 7) === m.slice(0, 7)).reverse();
  out.push(glabel('Movimentos de ' + mesMin(m)));
  out.push(doMes.length ? lista(doMes.map(x => linhaMovimento(i, x))) : hint(m < i.inicio.slice(0, 8) + '01' ? 'O contrato come\u00e7a a ' + diaLongo(i.inicio) + '.' : 'Sem movimentos neste m\u00eas.'));

  // Balan\u00e7o do im\u00f3vel: recebido \u2212 despesas do im\u00f3vel, desde o in\u00edcio do contrato
  const rec = S.receb.filter(r => r.imovel_id === im.id && r.data >= i.inicio && r.data.slice(0, 4) === ano);
  const desp = S.despImovel.filter(d => d.data >= i.inicio && d.data.slice(0, 4) === ano);
  const recAno = soma(rec, r => r.valor), despAno = soma(desp, d => d.valor), balAno = r2(recAno - despAno);
  out.push(glabel('Balan\u00e7o de ' + im.nome), group(h('div', { class: 'hero' },
      h('div', { class: 'k', text: ano + (i.inicio > ano + '-01-01' ? ' \u00b7 ' + desdeTxt(i.inicio) : '') }),
      h('div', { class: 'big ' + (balAno >= 0 ? 'pos' : 'neg'), text: (balAno > 0 ? '+' : '') + fmt(balAno) })),
    kv('Recebido', fmt(recAno), 'pos'), kv('Despesas do im\u00f3vel', '\u2212 ' + fmt(despAno))),
    hint('Recebido menos as despesas com a categoria \u00ab' + im.categoria + '\u00bb, desde o in\u00edcio do contrato. Antes de impostos: as rendas pagam IRS (categoria F).'));
  out.push(h('div', { class: 'linha-acoes' }, h('button', { type: 'button', class: 'link b', text: 'Editar im\u00f3vel', onclick: () => abrirImovel(im) }), novoImovel));
  return out;
}
// Cobrar ao inquilino uma despesa do im\u00f3vel (j\u00e1 paga por ti, mesmo noutro m\u00eas, ou nova)
function abrirCobranca(i) {
  const im = imovelAtual();
  const livres = S.despImovel.filter(d => !d.inquilino_id);
  const valor = h('input', { class: 'valorin', type: 'text', inputmode: 'decimal', placeholder: '0,00', 'aria-label': 'Valor a cobrar', 'aria-required': 'true' });
  const desc = h('input', { class: 'ginput', type: 'text', maxlength: '80', autocapitalize: 'sentences', 'aria-label': 'Descri\u00e7\u00e3o', 'aria-required': 'true', placeholder: 'Ex.: \u00c1gua de janeiro' });
  const pagaEm = h('input', { class: 'ginput', type: 'date', 'aria-label': 'Paguei em', 'aria-required': 'true', value: hojeISO() });
  const existente = h('select', { class: 'ginput', 'aria-label': 'Despesa j\u00e1 registada' }, h('option', { value: '', text: 'Escolher\u2026' }),
    livres.map(d => h('option', { value: String(d.id), text: (d.descricao || 'Sem descri\u00e7\u00e3o') + ' \u00b7 ' + diaCurto(d.data) + ' \u00b7 ' + fmt(d.valor) })));
  const cobrarEm = h('input', { class: 'ginput', type: 'date', 'aria-label': 'Cobrar em', 'aria-required': 'true', value: hojeISO() });
  const gNova = group(grow('Descri\u00e7\u00e3o', desc), grow('Paguei em', pagaEm));
  const gExist = group(grow('Despesa', existente));
  const draw = v => { gNova.hidden = valor.hidden = v !== 'nova'; gExist.hidden = v !== 'existente'; };
  const modo = escolha([['J\u00e1 registada', 'existente'], ['Nova', 'nova']], livres.length ? 'existente' : 'nova', 'Despesa j\u00e1 registada ou nova', false, draw);
  draw(livres.length ? 'existente' : 'nova');
  let s;
  s = sheet('Cobrar a ' + i.nome, [group(h('div', { class: 'pad' }, modo.el)), valor, gNova, gExist, group(grow('Cobrar em', cobrarEm)),
    hint('Podes cobrar uma despesa que pagaste noutro m\u00eas: conta na conta de ' + i.nome + ' na data \u00abCobrar em\u00bb.')], async () => {
    if (!cobrarEm.value) return s.erro('Indica quando a cobras.', cobrarEm);
    if (modo.valor() === 'existente') {
      if (!existente.value) return s.erro(livres.length ? 'Escolhe a despesa.' : 'N\u00e3o h\u00e1 despesas do im\u00f3vel por cobrar. Escolhe \u00abNova\u00bb.', existente);
      await q(sb.from('despesas').update({ inquilino_id: i.id, cobrada_em: cobrarEm.value }).eq('id', Number(existente.value)));
    } else {
      const v = validarValor(s, valor); if (v === null) return false;
      if (!desc.value.trim()) return s.erro('Diz o que \u00e9 (ex.: \u00c1gua de janeiro).', desc);
      if (!pagaEm.value) return s.erro('Indica quando a pagaste.', pagaEm);
      await q(sb.from('despesas').insert({ valor: v, descricao: desc.value.trim(), data: pagaEm.value, categoria: im.categoria, pago: true, inquilino_id: i.id, cobrada_em: cobrarEm.value }));
    }
    await carregarImoveis(); await recarregar(); toast('Cobrada a ' + i.nome);
  });
}

// O que o inquilino transferiu (um valor total; o saldo diz o que fica a dever)

  const nota = h('input', { class: 'ginput', type: 'text', maxlength: '120', placeholder: 'Opcional (ex.: renda + \u00e1gua)', 'aria-label': 'Nota', value: r ? (r.nota || '') : '' });

  s = sheet(novo ? i.nome + ' transferiu' : 'Editar transfer\u00eancia', [valor, h('div', { class: 'split', text: novo && ok(sugestao) ? '\u00e9 o que deve agora \u00b7 muda se transferiu outro valor' : 'recebido \u00b7 ' + im.nome }),
    group(grow('Data', data), grow('Nota', nota)),
    novo ? null : botaoApagar('Apagar transfer\u00eancia', 'Apagar esta transfer\u00eancia?', fmt(r.valor) + ' de ' + diaCurto(r.data) + '. O saldo de ' + i.nome + ' volta a contar sem ela.', async () => {
      await q(sb.from('recebimentos').delete().eq('id', r.id)); s.fechar(); await carregarImoveis(); render(); toast('Transfer\u00eancia apagada');
    }, () => s)], async () => {
    const v = validarValor(s, valor); if (v === null) return false;
    if (!data.value) return s.erro('Indica a data.', data);
    const payload = { imovel_id: im.id, inquilino_id: i.id, valor: v, data: data.value, nota: nota.value.trim() || null };
    if (novo) await q(sb.from('recebimentos').insert(Object.assign({ tipo: 'outro' }, payload)));
    else await q(sb.from('recebimentos').update(payload).eq('id', r.id));

}

    cats.map(c => h('option', { value: c, text: c, selected: c === ini })));

  s = sheet(novo ? 'Configurar im\u00f3vel' : 'Editar im\u00f3vel', [group(grow('Nome', nome), grow('Categoria das despesas', cat)),

    novo ? null : botaoApagar('Apagar inquilino', 'Apagar \u00ab' + i.nome + '\u00bb?', 'Os recebimentos ficam, sem inquilino associado.', async () => {
      await q(sb.from('inquilinos').delete().eq('id', i.id)); s.fechar(); await carregarImoveis(); render(); toast('Inquilino apagado');
    }, () => s)], async () => {
    const n = nome.value.trim();

function linhaFixa(x) {
  return h('button', { type: 'button', class: 'lrow' + (x.ativa ? '' : ' off'), onclick: () => abrirFixa(x) },
    h('div', { class: 'rmain' },
      h('div', { class: 'rtitle', text: x.nome }),
      h('div', { class: 'rsub', text: ['Dia ' + x.dia_vencimento, comum(x) ? 'Comum \u00b7 tua parte ' + fmt(minhaParte(x)) : null,
        x.variavel ? 'Vari\u00e1vel' : null, x.debito_direto ? 'D\u00e9bito direto' + (nomeConta(x.conta_id) ? ' \u00b7 ' + nomeConta(x.conta_id) : '') : null, x.para_conta_id != null ? 'Transfer\u00eancia' : null,
        x.ativa ? null : 'Pausada'].filter(Boolean).join(' \u00b7 ') })),
    h('div', { class: 'rval', text: (x.variavel ? '\u2248 ' : '') + fmt(x.valor) }),
    h('span', { class: 'chev', text: '\u203a', 'aria-hidden': 'true' }));
}
function viewFixas() {
  const ativas = S.fixas.filter(x => x.ativa && x.para_conta_id == null);
  if (!S.fixas.length) return [vazio('Ainda n\u00e3o tens despesas fixas: renda, \u00e1gua, luz, gin\u00e1sio\u2026', 'Adicionar despesa fixa', () => abrirFixa())];
  const temVar = ativas.some(x => x.variavel) ? '\u2248 ' : '';
  const out = [glabel('Por m\u00eas'), group(
    kv('Total', temVar + fmt(soma(ativas, x => x.valor)), 'strong'),
    ativas.some(comum) ? kv('A tua parte', temVar + fmt(soma(ativas, minhaParte))) : null)];
  const minhas = S.fixas.filter(x => !comum(x)), comuns = S.fixas.filter(comum);
  if (comuns.length) out.push(glabel('Em comum'), lista(comuns.map(linhaFixa)));
  if (minhas.length) out.push(glabel(comuns.length ? 'S\u00f3 minhas' : 'Despesas fixas'), lista(minhas.map(linhaFixa)));
  out.push(hint('Cada fixa entra todos os meses como \u00abpor pagar\u00bb no dia certo, e a agenda do iPhone avisa-te na v\u00e9spera. Se apagares a deste m\u00eas, n\u00e3o volta a aparecer.'));
  return out;
}

// Bloco "em comum": quem pagou e a tua parte (%) \u2014 devolve os campos para gravar
function blocoComum(x, valorInput, preset) {
  const c = S.casal;
  if (!c) return null;
  const ligado = x ? comum(x) : !!preset.comum;
  const sw = interruptor(ligado, 'Em comum com ' + ELA());
  const quem = escolha([['Eu', 'eu'], [ELA(), 'outro']], x && comum(x) && !pagouEu(x) ? 'outro' : 'eu', 'Quem pagou');
  const pctIni = x && comum(x) ? pctEu(x) : Number(c.eu.pct);
  const pct = h('input', { class: 'ginput num', type: 'text', inputmode: 'decimal', maxlength: '6', 'aria-label': 'A tua parte em percentagem', value: String(pctIni).replace('.', ',') });
  const info = h('div', { class: 'split', 'aria-live': 'polite' });
  const rQuem = h('div', { class: 'pad' }, h('div', { class: 'glab', style: 'margin-bottom:8px', text: 'Quem pagou' }), quem.el);
  const rPct = grow('A tua parte (%)', pct);
  const draw = () => {
    rQuem.hidden = rPct.hidden = !sw.checked;
    const v = parseNum(valorInput.value), p = parseNum(pct.value);
    info.hidden = !(sw.checked && ok(v) && v > 0 && ok(p) && p >= 0 && p <= 100);
    if (!info.hidden) info.textContent = 'Tu ' + fmt(r2(v * p / 100)) + ' \u00b7 ' + ELA() + ' ' + fmt(r2(v - r2(v * p / 100)));
  };
  [sw, pct, valorInput].forEach(el => el.addEventListener(el === sw ? 'change' : 'input', draw));
  draw();
  return {
    info: info,
    group: group(grow('Em comum com ' + ELA(), sw), rQuem, rPct),
    ler: s => {
      if (!sw.checked) return { casal_id: null, pago_por_membro: null, pct_m1: null };
      const p = parseNum(pct.value);
      if (!ok(p) || p < 0 || p > 100) { s.erro('A tua parte tem de ser entre 0 e 100%.', pct); return null; }
      const euM1 = c.eu.ordem === 1;
      return { casal_id: c.id, pago_por_membro: quem.valor() === 'eu' ? c.eu.membro_id : c.outro.membro_id, pct_m1: euM1 ? p : r2(100 - p) };
    }
  };
}

const REPETE = [['N\u00e3o repete', 'nunca'], ['Semanal', 'semanal'], ['Mensal', 'mensal'], ['Anual', 'anual']];
const ALERTAS = [['Sem alerta', null], ['Na hora', 0], ['15 min antes', 15], ['1 h antes', 60], ['1 dia antes', 1440]];
const hhmm = t => (t ? String(t).slice(0, 5) : '');
const horario = ev => (ev.dia_inteiro || !ev.hora_inicio ? 'Todo o dia' : hhmm(ev.hora_inicio) + (ev.hora_fim ? '\u2013' + hhmm(ev.hora_fim) : ''));
const FEED = SUPABASE_URL.replace('https://', '') + '/functions/v1/calendario';

// Repeti\u00e7\u00f5es: as mesmas regras do RRULE do feed (dias que n\u00e3o existem no m\u00eas s\u00e3o saltados)
function comecaEm(ev, iso) {
  if (ev.data === iso) return true;
  if (iso < ev.data || ev.repete === 'nunca') return false;
  const [y1, m1, d1] = ev.data.split('-').map(Number), [y2, m2, d2] = iso.split('-').map(Number);
  if (ev.repete === 'semanal') return Math.round((Date.UTC(y2, m2 - 1, d2) - Date.UTC(y1, m1 - 1, d1)) / 86400000) % 7 === 0;
  if (ev.repete === 'mensal') return d1 === d2;
  if (ev.repete === 'anual') return d1 === d2 && m1 === m2;
  return false;
}
const duracao = ev => (ev.data_fim && ev.data_fim > ev.data ? diasEntre(ev.data, ev.data_fim) : 0);
// Dia k (0 = primeiro) da ocorr\u00eancia do evento que cobre iso, ou -1
function posicaoEm(ev, iso) {
  const dur = duracao(ev);
  for (let k = 0; k <= dur; k++) if (comecaEm(ev, somaDias(iso, -k))) return k;
  return -1;
}
function itensDoMes(m) {
  const res = {}, ud = ultimoDia(m);
  const add = (iso, it) => { (res[iso] = res[iso] || []).push(it); };
  for (let d = 1; d <= ud; d++) {
    const iso = m.slice(0, 8) + pad2(d);
    S.eventos.forEach(ev => { const k = posicaoEm(ev, iso); if (k >= 0) add(iso, { tipo: 'evento', agenda: ev.agenda, ev: ev, k: k, dur: duracao(ev) }); });
  }
  S.fixas.filter(f => f.ativa && f.para_conta_id == null).forEach(f => {
    const iso = m.slice(0, 8) + pad2(Math.min(f.dia_vencimento, ud));
    const lanc = S.despesas.find(d => d.recorrente_id === f.id);
    if (iso >= f.inicio && (!f.fim || iso <= f.fim)) add(iso, { tipo: 'pagamento', agenda: 'pag', f: f, paga: !!(lanc && lanc.pago) });
  });
  return res;
}
const chaveOrdem = it => (it.tipo === 'pagamento' ? '0' : it.ev.dia_inteiro || !it.ev.hora_inicio || it.k > 0 ? '1' : '2' + it.ev.hora_inicio);
// Hor\u00e1rio de um evento num dos seus dias (v\u00e1rios dias: come\u00e7a / dia n de N / termina)
function horarioDia(ev, k, dur) {
  if (!dur) return horario(ev);
  const parte = 'Dia ' + (k + 1) + ' de ' + (dur + 1);
  if (ev.dia_inteiro || !ev.hora_inicio || (k > 0 && k < dur)) return 'Todo o dia \u00b7 ' + parte;
  if (k === 0) return 'Come\u00e7a \u00e0s ' + hhmm(ev.hora_inicio) + ' \u00b7 ' + parte;
  return (ev.hora_fim ? 'Termina \u00e0s ' + hhmm(ev.hora_fim) : '\u00daltimo dia') + ' \u00b7 ' + parte;
}

function viewAgenda() {
  const m = S.mes, [y, mo] = m.split('-').map(Number), ud = ultimoDia(m);
  if (!S.diaSel || S.diaSel.slice(0, 7) !== m.slice(0, 7)) S.diaSel = m === mesAtual() ? hojeISO() : m;
  const porDia = itensDoMes(m);
  const vazios = (new Date(y, mo - 1, 1).getDay() + 6) % 7; // semana come\u00e7a \u00e0 segunda
  const grid = h('div', { class: 'cal', role: 'group', 'aria-label': 'Dias de ' + mesMin(m) },
    ['seg', 'ter', 'qua', 'qui', 'sex', 's\u00e1b', 'dom'].map(d => h('div', { class: 'cal-dow', 'aria-hidden': 'true', text: d })),
    Array.from({ length: vazios }, () => h('div', { 'aria-hidden': 'true' })),
    Array.from({ length: ud }, (_, i) => {
      const iso = m.slice(0, 8) + pad2(i + 1), itens = porDia[iso] || [];
      const cores = itens.map(it => it.agenda).filter((a, k, arr) => arr.indexOf(a) === k).slice(0, 3);
      return h('button', {
        type: 'button', class: 'cal-dia' + (iso === hojeISO() ? ' hoje' : ''), 'aria-pressed': String(iso === S.diaSel),
        'aria-label': diaLongo(iso) + (itens.length ? ', ' + itens.length + (itens.length === 1 ? ' item' : ' itens') : ''),
        onclick: () => { S.diaSel = iso; render(); const b = document.querySelector('.cal-dia[aria-pressed="true"]'); if (b) b.focus(); }
      }, h('span', { class: 'cal-num', text: String(i + 1) }),
        h('span', { class: 'cal-pontos', 'aria-hidden': 'true' }, cores.map(c => h('i', { class: 'dot ag-' + c }))));
    }));
  const legenda = h('div', { class: 'legenda', 'aria-hidden': 'true' },
    AGENDAS.concat(['pag']).map(a => h('span', null, h('i', { class: 'dot ag-' + a }), nomeAg(a))));
  const itens = (porDia[S.diaSel] || []).slice().sort((a, b) => (chaveOrdem(a) < chaveOrdem(b) ? -1 : 1));
  const out = [group(h('div', { class: 'cal-wrap' }, grid)), legenda, glabel(diaLongo(S.diaSel))];
  if (S.loading && !S.eventos.length) out.push(...carregando());
  else if (!itens.length) out.push(vazio('Nada marcado para este dia.', 'Novo evento', () => abrirEvento(null, S.diaSel)));
  else out.push(lista(itens.map(linhaItemAgenda)));
  return out;
}

// Escolha \u00fanica em chips (aria-pressed)
function escolha(opcoes, atual, rotulo, comPonto, aoMudar) {
  let valor = atual;
  const box = h('div', { class: 'chips', role: 'group', 'aria-label': rotulo });
  const btns = opcoes.map(([label, v]) => h('button', {
    type: 'button', class: 'chip', 'aria-pressed': String(v === valor),
    onclick: () => { valor = v; btns.forEach((b, i) => b.setAttribute('aria-pressed', String(opcoes[i][1] === valor))); if (aoMudar) aoMudar(valor); }
  }, comPonto ? h('i', { class: 'dot ag-' + v, 'aria-hidden': 'true' }) : null, label));
  box.append(...btns);

function abrirEvento(ev, dataPreset) {
  const novo = !ev;
  const titulo = h('input', { class: 'ginput', type: 'text', autocapitalize: 'sentences', maxlength: '120', placeholder: 'Ex.: Jantar com a ' + ELA(), 'aria-label': 'T\u00edtulo', 'aria-required': 'true', value: ev ? ev.titulo : '', style: 'text-align:left' });
  const data = h('input', { class: 'ginput', type: 'date', value: ev ? ev.data : (dataPreset || hojeISO()), 'aria-label': 'Data', 'aria-required': 'true' });
  const dataFim = h('input', { class: 'ginput', type: 'date', value: ev ? (ev.data_fim || ev.data) : data.value, 'aria-label': 'Data de fim', 'aria-required': 'true' });

  let dataAnt = data.value;
  const arrastar = () => {
    if (data.value && dataAnt && dataFim.value && data.value !== dataAnt) dataFim.value = somaDias(data.value, Math.max(0, diasEntre(dataAnt, dataFim.value)));
    if (data.value) dataAnt = data.value;

  const fim = h('input', { class: 'ginput', type: 'time', value: ev ? hhmm(ev.hora_fim) : '', 'aria-label': 'Fim' });
  const rIni = grow('Come\u00e7a', h('div', { class: 'inline datahora' }, data, ini)), rFim = grow('Termina', h('div', { class: 'inline datahora' }, dataFim, fim));
  const drawDia = () => { ini.hidden = fim.hidden = swDia.checked; };
  swDia.addEventListener('change', drawDia); drawDia();
  const agenda = escolha(AGENDAS.map(a => [nomeAg(a), a]), ev ? ev.agenda : 'pessoal', 'Agenda', true);
  const repete = escolha(REPETE, ev ? ev.repete : 'nunca', 'Repeti\u00e7\u00e3o');
  const alerta = escolha(ALERTAS, ev ? ev.alerta_min : 15, 'Alerta');
  const local = h('input', { class: 'ginput', type: 'text', maxlength: '200', placeholder: 'Opcional', 'aria-label': 'Local', value: ev ? (ev.local || '') : '' });
  const notas = h('input', { class: 'ginput', type: 'text', maxlength: '2000', placeholder: 'Opcional', 'aria-label': 'Notas', value: ev ? (ev.notas || '') : '' });
  let s;
  s = sheet(novo ? 'Novo evento' : 'Editar evento', [
    group(h('div', { class: 'pad' }, titulo)),
    glabel('Agenda', 'h3'), group(h('div', { class: 'pad' }, agenda.el)),
    group(grow('Todo o dia', swDia), rIni, rFim),
    glabel('Repeti\u00e7\u00e3o', 'h3'), group(h('div', { class: 'pad' }, repete.el)),
    glabel('Alerta no iPhone', 'h3'), group(h('div', { class: 'pad' }, alerta.el)),
    group(grow('Local', local), grow('Notas', notas)),
    novo ? null : botaoApagar('Apagar evento', 'Apagar \u00ab' + ev.titulo + '\u00bb?', ev.repete !== 'nunca' ? 'Apaga todas as repeti\u00e7\u00f5es. N\u00e3o d\u00e1 para desfazer.' : 'N\u00e3o d\u00e1 para desfazer.', async () => {
      await q(sb.from('eventos').delete().eq('id', ev.id));
      s.fechar(); await recarregar(); toast('Evento apagado');
    }, () => s)
  ], async () => {
    const t = titulo.value.trim();
    if (!t) return s.erro('D\u00e1 um t\u00edtulo ao evento.', titulo);
    if (!data.value) return s.erro('Indica a data.', data);
    const df = dataFim.value || data.value;
    if (df < data.value) return s.erro('O fim tem de ser no pr\u00f3prio dia ou depois do in\u00edcio.', dataFim);
    if (diasEntre(data.value, df) > 366) return s.erro('Um evento pode durar no m\u00e1ximo um ano.', dataFim);
    const varios = df > data.value;
    const dia = swDia.checked;
    if (!dia && !ini.value) return s.erro('Indica a hora de in\u00edcio ou marca \u00abTodo o dia\u00bb.', ini);
    if (!dia && !varios && fim.value && fim.value <= ini.value) return s.erro('O fim tem de ser depois do in\u00edcio.', fim);
    if (!dia && varios && !fim.value) return s.erro('Indica a hora a que termina.', fim);

      titulo: t, agenda: agenda.valor(), data: data.value, data_fim: df, dia_inteiro: dia,
      hora_inicio: dia ? null : ini.value, hora_fim: dia ? null : (fim.value || null),
      repete: repete.valor(), alerta_min: alerta.valor(),
      local: local.value.trim() || null, notas: notas.value.trim() || null

    if (novo) await q(sb.from('eventos').insert(payload));
    else await q(sb.from('eventos').update(payload).eq('id', ev.id));
    S.diaSel = payload.data;
    const mesE = payload.data.slice(0, 8) + '01';
    if (mesE !== S.mes) S.mes = mesE;
    await recarregar();

// ===================== PIN (bloqueio do ecr\u00e3) =====================
// O PIN fica s\u00f3 neste dispositivo (PBKDF2 com sal, nunca sai do iPhone). N\u00e3o substitui o login:
// 5 tentativas erradas terminam a sess\u00e3o e obrigam a entrar com email e palavra-passe.
const PIN = { chave: 'gpp.pin.v1', falhas: 'gpp.pin.falhas', max: 5, foraMs: 60000 };
const lsGet = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, v); return true; } catch (e) { return false; } };
const lsDel = k => { try { localStorage.removeItem(k); } catch (e) { /* sem armazenamento */ } };
const b64 = buf => btoa(String.fromCharCode.apply(null, new Uint8Array(buf)));
async function hashPin(pin, sal) {
  const salt = Uint8Array.from(atob(sal), c => c.charCodeAt(0));
  const k = await crypto.subtle.importKey('raw', new TextEncoder().encode(pin), 'PBKDF2', false, ['deriveBits']);
  return b64(await crypto.subtle.deriveBits({ name: 'PBKDF2', salt: salt, iterations: 150000, hash: 'SHA-256' }, k, 256));
}
const pinPossivel = () => !!(window.crypto && crypto.subtle && lsSet('gpp.teste', '1'));
function pinDe(uid) { try { const p = JSON.parse(lsGet(PIN.chave) || 'null'); return p && p.user === uid ? p : null; } catch (e) { return null; } }
async function gravarPin(uid, pin) {
  const sal = b64(crypto.getRandomValues(new Uint8Array(16)));
  lsSet(PIN.chave, JSON.stringify({ user: uid, sal: sal, hash: await hashPin(pin, sal) }));
  lsDel(PIN.falhas);
}
const pinObvio = p => /^(\d)\1{3}$/.test(p) || '0123456789'.includes(p) || '9876543210'.includes(p);
let teclasPin = null;

// modo: 'criar' (pede 2x) \u00b7 'abrir' \u00b7 'atual' (antes de mudar o PIN)
function ecraPin(modo, uid, aoAcabar, aoCancelar) {
  document.querySelectorAll('dialog').forEach(d => d.remove());
  document.body.classList.remove('noscroll');
  if (teclasPin) document.removeEventListener('keydown', teclasPin);
  let digitos = '', primeiro = null, ocupado = false;
  const titulo = h('h1', { id: 'pin-t' });
  const sub = h('p', { class: 'pin-sub' });
  const pontos = h('div', { class: 'pin-pontos', 'aria-hidden': 'true' }, [0, 1, 2, 3].map(() => h('i')));
  const estado = h('p', { class: 'sr-only', role: 'status', 'aria-live': 'polite' });
  const msg = h('p', { class: 'pin-erro', role: 'alert' });
  const sair = fn => () => { document.removeEventListener('keydown', teclasPin); teclasPin = null; fn(); };
  const textos = () => {
    if (modo === 'criar') {
      titulo.textContent = primeiro ? 'Confirma o PIN' : 'Cria um PIN';
      sub.textContent = primeiro ? 'Escreve o mesmo PIN outra vez.' : '4 d\u00edgitos para abrir a app neste iPhone. N\u00e3o uses o PIN do cart\u00e3o.';
    } else {
      titulo.textContent = modo === 'atual' ? 'PIN atual' : 'GPP Dashboard';
      sub.textContent = modo === 'atual' ? 'Escreve o PIN atual para o mudares.' : 'Escreve o teu PIN.';
    }
  };
  const desenhar = () => {
    [...pontos.children].forEach((p, i) => p.classList.toggle('on', i < digitos.length));
    estado.textContent = digitos.length + ' de 4 d\u00edgitos';
  };
  const falhou = t => { msg.textContent = t; pontos.classList.add('erro'); digitos = ''; desenhar(); };
  async function completo() {
    ocupado = true;
    try {
      if (modo === 'criar') {
        if (!primeiro) {
          if (pinObvio(digitos)) return falhou('PIN demasiado \u00f3bvio. Escolhe outro.');
          primeiro = digitos; digitos = ''; msg.textContent = ''; pontos.classList.remove('erro'); textos(); desenhar(); return;
        }
        if (digitos !== primeiro) { primeiro = null; textos(); return falhou('Os PINs n\u00e3o coincidem. Come\u00e7a de novo.'); }
        await gravarPin(uid, digitos);
        return sair(aoAcabar)();
      }
      const p = pinDe(uid);
      if (p && await hashPin(digitos, p.sal) === p.hash) { lsDel(PIN.falhas); return sair(aoAcabar)(); }
      const n = (parseInt(lsGet(PIN.falhas) || '0', 10) || 0) + 1;
      if (!p || n >= PIN.max) {
        lsDel(PIN.falhas); lsDel(PIN.chave);
        S.avisoLogin = 'Demasiadas tentativas erradas. Entra com o email e a palavra-passe e cria um PIN novo.';
        document.removeEventListener('keydown', teclasPin); teclasPin = null;
        await sb.auth.signOut();
        return;
      }
      lsSet(PIN.falhas, String(n));
      const resta = PIN.max - n;
      falhou('PIN errado. ' + (resta === 1 ? '\u00daltima tentativa antes de terminar a sess\u00e3o.' : 'Faltam ' + resta + ' tentativas.'));
    } finally { ocupado = false; }
  }
  const premir = n => {
    if (ocupado || digitos.length >= 4) return;
    if (!digitos) pontos.classList.remove('erro');
    digitos += n; desenhar();
    if (digitos.length === 4) completo();
  };
  const apagar = () => { if (!ocupado) { digitos = digitos.slice(0, -1); desenhar(); } };
  const tecla = (t, fn, cls, aria) => h('button', { type: 'button', class: 'pin-tecla' + (cls ? ' ' + cls : ''), text: t, 'aria-label': aria || null, onclick: fn });
  const teclado = h('div', { class: 'pin-teclado' },
    ['1', '2', '3', '4', '5', '6', '7', '8', '9'].map(n => tecla(n, () => premir(n))),
    aoCancelar ? tecla('Cancelar', sair(aoCancelar), 'txt') : h('span', { 'aria-hidden': 'true' }),
    tecla('0', () => premir('0')),
    tecla('\u232b', apagar, 'txt', 'Apagar d\u00edgito'));
  teclasPin = e => {
    if (/^[0-9]$/.test(e.key)) { e.preventDefault(); premir(e.key); }
    else if (e.key === 'Backspace') { e.preventDefault(); apagar(); }
  };
  document.addEventListener('keydown', teclasPin);
  const esqueci = () => {
    lsDel(PIN.chave); lsDel(PIN.falhas);
    S.avisoLogin = 'Entra com o email e a palavra-passe para criares um PIN novo.';
    document.removeEventListener('keydown', teclasPin); teclasPin = null;
    sb.auth.signOut();
  };
  textos(); desenhar();
  app.replaceChildren(h('main', { class: 'pin', 'aria-labelledby': 'pin-t' },
    titulo, sub, pontos, estado, msg, teclado,
    modo !== 'criar' ? h('button', { type: 'button', class: 'link b', text: 'Esqueci-me do PIN', onclick: esqueci }) : null));
}
// Tranca a app (ao abrir ou ao voltar depois de PIN.foraMs fora)
function bloquear() {
  if (!S.user || !pinDe(S.user.id)) return false;
  S.bloqueado = true;
  ecraPin('abrir', S.user.id, () => { S.bloqueado = false; render(); recarregar(); });
  return true;
}
function mudarPin() {
  const uid = S.user.id, voltar = () => { S.bloqueado = false; render(); };
  S.bloqueado = true;   // um carregamento por tr\u00e1s n\u00e3o tapa o ecr\u00e3 do PIN
  const criar = () => ecraPin('criar', uid, () => { voltar(); toast('PIN alterado'); }, voltar);
  if (pinDe(uid)) ecraPin('atual', uid, criar, voltar); else criar();
}

function renderLogin(criar) {
  document.querySelectorAll('dialog').forEach(d => d.remove());
  document.body.classList.remove('noscroll');
  const email = h('input', { class: 'lfield', type: 'email', autocomplete: 'username', autocapitalize: 'none', autocorrect: 'off', spellcheck: 'false', enterkeyhint: 'next', placeholder: 'Email', 'aria-label': 'Email', required: true });
  const pass = h('input', { class: 'lfield', type: 'password', autocomplete: criar ? 'new-password' : 'current-password', enterkeyhint: 'go', placeholder: criar ? 'Palavra-passe (m\u00edn. 8)' : 'Palavra-passe', 'aria-label': 'Palavra-passe', required: true });
  const lerr = h('p', { class: 'lerr', id: 'login-erro', role: 'alert', hidden: !S.avisoLogin, text: S.avisoLogin || '' });
  S.avisoLogin = null;
  const btn = h('button', { class: 'btn primary', type: 'submit', text: criar ? 'Criar conta' : 'Entrar' });
  const trocar = h('button', { class: 'link b', type: 'button', text: criar ? 'J\u00e1 tenho conta \u00b7 Entrar' : 'Ainda n\u00e3o tens conta? Criar conta', onclick: () => renderLogin(!criar) });
  const form = h('form', { class: 'login', 'aria-labelledby': 'login-t' },
    h('div', { class: 'logo', 'aria-hidden': 'true', text: 'GPP' }), h('h1', { id: 'login-t', text: criar ? 'Criar conta' : 'GPP Dashboard' }),
    h('p', { text: criar ? 'Para registares despesas e partilhares as da casa.' : 'As tuas despesas e as da casa, e o que falta pagar.' }),
    email, pass, lerr, btn, trocar);
  const limpar = () => { lerr.hidden = true; [email, pass].forEach(i => { i.removeAttribute('aria-invalid'); i.removeAttribute('aria-describedby'); }); };
  const falha = (msg, campos) => {
    lerr.textContent = msg; lerr.hidden = false;
    campos.forEach(i => { i.setAttribute('aria-invalid', 'true'); i.setAttribute('aria-describedby', 'login-erro'); });
    campos[campos.length - 1].focus();
  };
  form.addEventListener('input', limpar);
  form.addEventListener('submit', async e => {
    e.preventDefault();
    limpar();
    if (criar && pass.value.length < 8) return falha('A palavra-passe tem de ter pelo menos 8 caracteres.', [pass]);
    btn.disabled = true; btn.textContent = criar ? 'A criar\u2026' : 'A entrar\u2026';
    const r = criar ? await sb.auth.signUp({ email: email.value.trim(), password: pass.value })
                    : await sb.auth.signInWithPassword({ email: email.value.trim(), password: pass.value });
    btn.disabled = false; btn.textContent = criar ? 'Criar conta' : 'Entrar';
    if (r.error) { console.error(r.error); return falha(traduzErro(r.error), [email, pass]); }
    if (criar && !(r.data && r.data.session)) {
      S.avisoLogin = 'Conta criada. Abre o email de confirma\u00e7\u00e3o que te envi\u00e1mos e depois entra aqui.';
      return renderLogin(false);
    }
    const u = r.data.user;
    if (pinPossivel() && !pinDe(u.id)) ecraPin('criar', u.id, () => entrar(u));
    else await entrar(u);
  });
  app.replaceChildren(h('main', null, form));
}

async function entrar(user) {
  S.user = user;
  S.mes = mesAtual();
  S.tab = 'pagar';
  S.despesas = []; S.casal = null;
  app.replaceChildren(h('main', { 'aria-busy': 'true' }, carregando()));
  try { S.config = await q(sb.rpc('garantir_config')); }
  catch (e) { erro(e); S.config = {}; }
  render();
  await Promise.all([carregarMes(), carregarFixas(), carregarCategorias(), carregarContas()]);
  render();
}

sb.auth.onAuthStateChange(ev => {
  if (ev === 'SIGNED_OUT') {
    S.user = null; S.config = null; S.despesas = []; S.atrasados = []; S.fixas = []; S.eventos = []; S.acertos = []; S.casal = null; S.imoveis = null; S.inquilinos = []; S.receb = []; S.despImovel = []; S.imovelSel = null; S.diaSel = null;
    S.bloqueado = false;
    setTimeout(() => renderLogin(false), 0);
  }
});

// Valores: ao sair do campo mostra o n\u00famero como a app o leu (12.500 \u2192 12500,00); inv\u00e1lido fica marcado
document.addEventListener('focusout', e => {
  const el = e.target;
  if (!(el instanceof HTMLInputElement) || el.inputMode !== 'decimal' || !el.value.trim()) return;
  const n = parseNum(el.value);
  if (ok(n)) { if (el.value !== toInput(n)) el.value = toInput(n); if (el.getAttribute('aria-invalid') === 'true' && !el.hasAttribute('aria-describedby')) el.removeAttribute('aria-invalid'); }
  else el.setAttribute('aria-invalid', 'true');
});

// Ao voltar \u00e0 app (ex.: depois de pagar com Apple Pay), atualiza
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden') { S.saiuEm = Date.now(); document.body.classList.add('privado'); return; }
  document.body.classList.remove('privado');
  if (!S.user || S.bloqueado) return;
  if (S.saiuEm && Date.now() - S.saiuEm >= PIN.foraMs && bloquear()) return;
  if (S.mes) recarregar();
});

(async function init() {
  try {
    const r = await sb.auth.getSession();
    const session = r.data && r.data.session;
    if (!session) return renderLogin();
    const u = session.user;
    if (!pinPossivel()) return entrar(u);
    if (pinDe(u.id)) { S.bloqueado = true; ecraPin('abrir', u.id, () => { S.bloqueado = false; entrar(u); }); }
    else ecraPin('criar', u.id, () => entrar(u));
  } catch (e) { erro(e); renderLogin(); }
})();
})();

</script>
</body>
