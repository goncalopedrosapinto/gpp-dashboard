<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="GPP">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="format-detection" content="telephone=no">
<meta name="description" content="Os meus gastos e ganhos, contas partilhadas e despesas fixas.">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<title>GPP Dashboard</title>
<style>
/* Regras de UI: ibelick/ui-skills (baseline-ui + fixing-accessibility), adaptadas a CSS sem Tailwind */
:root{
  --bg:#f2f2f7; --card:#ffffff; --text:#000000; --muted:#6c6c70; --line:rgb(60 60 67 / .18);
  --accent:#0060df; --pos:#137a3f; --neg:#c62d22; --chip:#e5e5ea; --segon:#ffffff;
  --warn-bg:#fff1cc; --warn-text:#7a4f00; --press:#e5e5ea; --skel:#e5e5ea; --on-accent:#ffffff;
  /* escala fixa de z-index */
  --z-header:10; --z-tabbar:20; --z-toast:40;
  /* escala de sombras (valores por defeito do Tailwind) */
  --shadow-sm:0 1px 2px 0 rgb(0 0 0 / .05);
  --shadow:0 1px 3px 0 rgb(0 0 0 / .1),0 1px 2px -1px rgb(0 0 0 / .1);
  --shadow-lg:0 10px 15px -3px rgb(0 0 0 / .1),0 4px 6px -4px rgb(0 0 0 / .1);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#000000; --card:#1c1c1e; --text:#ffffff; --muted:#98989f; --line:rgb(84 84 88 / .65);
    --accent:#4da3ff; --pos:#32d26a; --neg:#ff6259; --chip:#2c2c2e; --segon:#636366;
    --warn-bg:#3d2f0a; --warn-text:#ffd27a; --press:#2c2c2e; --skel:#2c2c2e; --on-accent:#000000;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none !important}
html,body{margin:0;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif;
  font-size:17px;line-height:1.3;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
body{min-height:100dvh}
body.noscroll{overflow:hidden}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:16px} /* abaixo de 16px o iPhone faz zoom ao focar */
h1,h2,h3,.stitle{text-wrap:balance}
p,.hint{text-wrap:pretty}
.num{font-variant-numeric:tabular-nums}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}

/* Foco visível (teclado) */
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ginput:focus-visible,.valorin:focus-visible,.lfield:focus-visible{outline:none}
.grow:has(.ginput:focus-visible){box-shadow:inset 0 0 0 2px var(--accent)}
.valorin:focus-visible{box-shadow:0 2px 0 0 var(--accent)}
.lfield:focus-visible{box-shadow:0 0 0 2px var(--accent)}
.lrow:focus-visible{outline-offset:-2px}

/* Cabeçalho */
.top{position:sticky;top:0;z-index:var(--z-header);padding:calc(env(safe-area-inset-top, 0px) + 12px) 16px 8px;
  background:color-mix(in srgb,var(--bg) 86%,transparent);
  -webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px)}
.top h1{font-size:34px;font-weight:700;margin:0;line-height:1.15}
.toprow{display:flex;align-items:center;justify-content:space-between;gap:12px}
.acts{display:flex;align-items:center;gap:10px}
.addbtn{flex:none;width:38px;height:38px;border-radius:19px;border:0;background:var(--accent);color:var(--on-accent);font-size:26px;line-height:38px;padding:0 0 2px;box-shadow:var(--shadow)}
.gearbtn{flex:none;width:38px;height:38px;border-radius:19px;border:0;background:var(--chip);color:var(--accent);display:grid;place-items:center;padding:0}
.gearbtn svg{width:20px;height:20px}
.mesnav{display:flex;align-items:center;gap:2px;margin-top:4px}
.navbtn{background:none;border:0;color:var(--accent);font-size:30px;line-height:1;padding:0 10px 4px;margin-left:-10px}
.navbtn+.mesnome{margin-left:-6px}
.navbtn:disabled{opacity:.3}
.mesnome{font-size:17px;font-weight:600;min-width:8.6em;text-align:center}
.link{background:none;border:0;color:var(--accent);font-size:17px;padding:8px 0}
.link.b{font-weight:600}
.link.small{font-size:15px;margin-left:auto;padding:4px 0}
.link.small2{font-size:15px;padding:4px 0;flex:none}
.linha-acoes{display:flex;justify-content:flex-end;gap:22px;margin:4px 16px 0}
select.ginput{-webkit-appearance:none;appearance:none;text-align:right;text-align-last:right;color:var(--accent);cursor:pointer}
.rval.neg,.big.neg{color:var(--neg)}
.link:disabled{opacity:.4}

main{max-width:640px;margin:0 auto;padding:0 16px calc(104px + env(safe-area-inset-bottom, 0px))}

/* Secções agrupadas, estilo iOS */
.glabel{font-size:13px;font-weight:400;color:var(--muted);text-transform:uppercase;margin:22px 16px 7px}
main > .glabel:first-child,main > .chips + .glabel{margin-top:8px}
.group{background:var(--card);border-radius:12px;overflow:hidden}
ul.group{list-style:none;margin:0;padding:0}
ul.group > li:not(:last-child){border-bottom:.5px solid var(--line)}
.grow{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:46px;padding:6px 16px;border-bottom:.5px solid var(--line)}
.grow:last-child{border-bottom:0}
.glab{flex:none}
.grow:has([aria-invalid="true"]) .glab{color:var(--neg)}
.gval{color:var(--muted);text-align:right}
.gval.strong{color:var(--text);font-weight:600}
.ginput{flex:1;min-width:0;border:0;background:transparent;color:var(--text);font-size:17px;text-align:right;padding:8px 0}
.ginput::placeholder{color:var(--muted);opacity:.7}
.pad{padding:12px 16px}
.hint{font-size:13px;color:var(--muted);margin:7px 16px 0;line-height:1.4}
.hint.warn{color:var(--warn-text)}
.hint.center{text-align:center;margin:0 0 14px}
.empty{text-align:center;color:var(--muted);margin:48px 16px}
.empty p{margin:0}
.empty .btn{display:inline-block;width:auto;padding:12px 22px;margin-top:16px}

/* Destaques */
.hero{padding:14px 16px 16px}
.hero .k{font-size:15px;color:var(--muted)}
.big{font-size:36px;font-weight:700;margin-top:2px;font-variant-numeric:tabular-nums}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.duo .big{font-size:26px}
.pos{color:var(--pos)}
.neg{color:var(--neg)}
.pill{display:inline-block;margin-top:10px;padding:4px 10px;border-radius:12px;font-size:13px;font-weight:600}
.pill.warn{background:var(--warn-bg);color:var(--warn-text)}

/* Linhas de lista */
.lrow{display:flex;align-items:center;gap:12px;width:100%;padding:10px 16px;background:none;border:0;
  border-bottom:.5px solid var(--line);text-align:left;color:inherit;font:inherit}
.lrow:last-child{border-bottom:0}
button.lrow:active{background:var(--press)}
.lrow.off{opacity:.55}
.rmain{flex:1;min-width:0}
.rtitle{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rsub{font-size:13px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rsub.warn{color:var(--warn-text)}
.rval{font-weight:600;white-space:nowrap;font-variant-numeric:tabular-nums}
.rval.pos{color:var(--pos)}
.chev{color:var(--muted);opacity:.5;font-size:20px;margin-left:-4px}
.mini{flex:none;border:0;background:var(--accent);color:var(--on-accent);font-weight:600;font-size:14px;padding:6px 12px;border-radius:14px}
.linkrow{flex:1;min-width:0;background:none;border:0;padding:0;text-align:left;color:inherit;font:inherit}
.catrow{padding:10px 16px}
.cattop{display:flex;justify-content:space-between;gap:12px}
.bar{height:6px;border-radius:3px;background:var(--accent);margin-top:7px;min-width:4px}
.uso{height:4px;border-radius:2px;background:var(--chip);margin-top:6px;overflow:hidden}
.uso i{display:block;height:100%;background:var(--accent);border-radius:2px}
.uso i.alto{background:var(--neg)}
.datahora{gap:8px}
.datahora .ginput[type=date]{flex:1.4}

/* Esqueletos de carregamento (estáticos) */
.skel{background:var(--card);border-radius:12px;padding:6px 16px;margin-top:22px}
.skel i{display:block;height:13px;border-radius:7px;background:var(--skel);margin:12px 0;width:80%}
.skel i.w40{width:40%}
.skel i.w60{width:60%}
.skel i.big{height:32px;width:50%;border-radius:10px}

/* Controlos */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;margin:8px -16px 0;padding:0 16px 2px;scrollbar-width:none}
.chips.scroll::-webkit-scrollbar{display:none}
.chip{flex:none;padding:7px 13px;border-radius:17px;background:var(--chip);border:0;font-size:15px;color:var(--text)}
.chip.on,.chip[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.switch{-webkit-appearance:none;appearance:none;width:51px;height:31px;border-radius:16px;background:var(--chip);position:relative;flex:none;margin:0;transition:background-color .15s ease-out}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:var(--shadow);transition:transform .15s ease-out}
.switch:checked{background:var(--accent)}
.switch:checked::after{transform:translateX(20px)}
.inline{display:flex;align-items:center;justify-content:flex-end;gap:12px;flex:1;min-width:0}
.btn{display:block;width:100%;padding:14px;border-radius:12px;border:0;font-size:17px;font-weight:600;margin:12px 0 0}
.btn.primary{background:var(--accent);color:var(--on-accent)}
.btn.ghost{background:var(--card);color:var(--accent)}
.btn.danger{background:var(--card);color:var(--neg);margin-top:22px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.valorin{display:block;width:100%;font-size:46px;font-weight:700;text-align:center;border:0;background:transparent;color:var(--text);padding:8px 0 2px;font-variant-numeric:tabular-nums}
.valorin::placeholder{color:var(--muted);opacity:.45}
.valorin.pos{color:var(--pos)}
.valorin[aria-invalid="true"]{color:var(--neg)}
.split{text-align:center;color:var(--muted);font-size:15px;margin:0 0 16px;font-variant-numeric:tabular-nums}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
ol.steps{margin:0;padding:12px 16px 12px 36px;font-size:15px;line-height:1.45}
ol.steps li{margin:0 0 7px}
ol.steps li:last-child{margin:0}
ol.steps b{font-weight:600}

/* Barra de separadores */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:var(--z-tabbar);display:grid;grid-template-columns:repeat(5,1fr);
  padding:6px 0 calc(env(safe-area-inset-bottom, 0px) + 4px);border-top:.5px solid var(--line);
  background:color-mix(in srgb,var(--card) 88%,transparent);
  -webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px)}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;font-weight:500;color:var(--muted);background:none;border:0;padding:3px 0}
.tab svg{width:26px;height:26px}
.tab.on{color:var(--accent)}

/* Folha de edição: <dialog> nativo (foco preso, Escape fecha) */
dialog.sheet{position:fixed;inset:auto 0 0 0;margin:0 auto;width:100%;max-width:640px;max-height:92dvh;padding:0;border:0;
  border-radius:14px 14px 0 0;background:var(--bg);color:var(--text);overflow-y:auto;-webkit-overflow-scrolling:touch;box-shadow:var(--shadow-lg)}
dialog.sheet::backdrop,dialog.alert::backdrop{background:rgb(0 0 0 / .4)}
.sheet-in{padding:6px 16px calc(env(safe-area-inset-bottom, 0px) + 20px)}
.grab{width:36px;height:5px;border-radius:3px;background:var(--line);margin:2px auto 4px}
.snav{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;margin-bottom:4px}
.snav .link:first-child{justify-self:start}
.snav .r{justify-self:end}
.stitle{font-size:17px;font-weight:600;margin:0}
.sheet-in .group{margin-bottom:18px}
.sheet-in .glabel{margin-top:0}
.ferr{color:var(--neg);font-size:15px;font-weight:600;margin:4px 0 12px;text-align:center}

/* Confirmação para ações destrutivas */
dialog.alert{border:0;border-radius:14px;padding:20px 16px 14px;width:min(300px,calc(100% - 32px));background:var(--card);color:var(--text);text-align:center;box-shadow:var(--shadow-lg)}
.alert h2{font-size:17px;font-weight:600;margin:0 0 6px}
.alert p{margin:0 0 16px;color:var(--muted);font-size:15px}
.acts2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.acts2 button{padding:12px;border-radius:10px;border:0;font-size:17px;background:var(--chip);color:var(--text)}
.acts2 .danger{background:var(--neg);color:#fff;font-weight:600}

/* Entrada */
.login{max-width:380px;margin:0 auto;padding:calc(env(safe-area-inset-top, 0px) + 16vh) 24px 40px;display:flex;flex-direction:column;gap:12px}
.login h1{font-size:30px;margin:6px 0 0}
.login > p{margin:0 0 14px;color:var(--muted)}
.logo{width:72px;height:72px;border-radius:18px;background:var(--accent);color:var(--on-accent);font-weight:800;font-size:23px;display:grid;place-items:center}
.lfield{font-size:17px;padding:14px 16px;border-radius:12px;border:0;background:var(--card);color:var(--text)}
.lfield[aria-invalid="true"]{box-shadow:0 0 0 2px var(--neg)}
.lerr{color:var(--neg);font-size:15px;font-weight:600;margin:0}

#toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom, 0px));z-index:var(--z-toast);transform:translate(-50%,8px);
  max-width:calc(100% - 32px);padding:10px 16px;border-radius:20px;background:rgb(28 28 30 / .94);color:#fff;font-size:15px;
  opacity:0;pointer-events:none;transition:opacity .15s ease-out,transform .15s ease-out;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
#toast.bad{background:#b3261e}


/* Agenda */
:root{--ag-pessoal:#0060df;--ag-trabalho:#b45309;--ag-bia:#be185d;--ag-outro:#6b7280;--ag-pag:#137a3f}
@media (prefers-color-scheme: dark){:root{--ag-pessoal:#4da3ff;--ag-trabalho:#f59e0b;--ag-bia:#f472b6;--ag-outro:#9ca3af;--ag-pag:#32d26a}}
.ag-pessoal{--c:var(--ag-pessoal)} .ag-trabalho{--c:var(--ag-trabalho)} .ag-bia{--c:var(--ag-bia)} .ag-outro{--c:var(--ag-outro)} .ag-pag{--c:var(--ag-pag)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--c);flex:none}
.chip .dot{margin-right:6px;vertical-align:1px}
.chip[aria-pressed="true"] .dot{box-shadow:0 0 0 2px var(--on-accent)}
.cal-wrap{padding:8px 8px 10px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.cal-dow{font-size:12px;color:var(--muted);text-align:center;padding:4px 0 6px;text-transform:uppercase}
.cal-dia{display:flex;flex-direction:column;align-items:center;gap:3px;min-height:46px;padding:6px 0 4px;border:0;border-radius:10px;background:none;color:var(--text);font-size:16px;font-variant-numeric:tabular-nums}
.cal-dia.hoje .cal-num{color:var(--accent);font-weight:700}
.cal-dia[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.cal-dia[aria-pressed="true"] .cal-num{color:var(--on-accent)}
.cal-dia[aria-pressed="true"] .dot{box-shadow:0 0 0 1.5px var(--on-accent)}
.cal-pontos{display:flex;gap:3px;min-height:6px}
.cal-pontos .dot{width:6px;height:6px}
.legenda{display:flex;flex-wrap:wrap;gap:6px 14px;margin:10px 16px 0;font-size:13px;color:var(--muted)}
.legenda span{display:inline-flex;align-items:center;gap:6px}
.barra{width:4px;align-self:stretch;border-radius:2px;background:var(--c);flex:none;margin:2px 0}
input[type="time"].ginput,input[type="date"].ginput{min-height:34px}


/* mobile-native (Emil Kowalski): o que separa um site de uma app instalada no iPhone */
html,body{overscroll-behavior:none}                 /* sem "elástico" da página inteira */
dialog.sheet{overscroll-behavior:contain}           /* a folha faz scroll sem arrastar a página */
.chips.scroll{overscroll-behavior-x:contain}
button,a,[role="button"],.chip,.tab,.cal-dia{       /* toque imediato; sem seleção nem menu ao manter premido */
  touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.btn,.addbtn,.gearbtn,.mini,.chip,.cal-dia,.seg button,.acts2 button{transition:transform 100ms ease-out}
.btn:active,.addbtn:active,.gearbtn:active,.mini:active,.chip:active,.cal-dia:active,.seg button:active,.acts2 button:active{transform:scale(0.97)}
.btn:disabled:active{transform:none}
.link:active,.navbtn:active,.tab:active{opacity:.6}
.top,main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.tabbar{padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{transition:none !important;animation:none !important}
}
</style>
</head>
<body>
<div id="app"><p class="empty">A abrir…</p></div>
<div id="toast" role="status" aria-live="polite"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js"></script>
<script>
/*APP_JS*/
</script>
</body>
</html>
