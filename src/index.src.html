<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="GPP">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="format-detection" content="telephone=no">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<title>GPP Dashboard</title>
<style>
:root{
  --bg:#f2f2f7; --card:#ffffff; --text:#000000; --muted:#6c6c70; --line:rgba(60,60,67,.18);
  --accent:#0a6cff; --pos:#1a8f4c; --neg:#d0342a; --chip:#e5e5ea; --segon:#ffffff;
  --warn-bg:#fff1cc; --warn-text:#8a5a00; --press:#e5e5ea; --bar:#0a6cff;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#000000; --card:#1c1c1e; --text:#ffffff; --muted:#98989f; --line:rgba(84,84,88,.65);
    --accent:#3d9bff; --pos:#32d26a; --neg:#ff6259; --chip:#2c2c2e; --segon:#636366;
    --warn-bg:#3d2f0a; --warn-text:#ffd27a; --press:#2c2c2e; --bar:#3d9bff;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none !important}
html,body{margin:0;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif;
  font-size:17px;line-height:1.3;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
body{min-height:100dvh}
body.noscroll{overflow:hidden}
button{font-family:inherit;cursor:pointer}
input{font-family:inherit}
.num{font-variant-numeric:tabular-nums}

/* Cabeçalho */
.top{position:sticky;top:0;z-index:5;padding:calc(env(safe-area-inset-top) + 12px) 16px 8px;
  background:color-mix(in srgb,var(--bg) 86%,transparent);
  -webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px)}
.top h1{font-size:34px;font-weight:700;letter-spacing:.2px;margin:0;line-height:1.15}
.mesnav{display:flex;align-items:center;gap:2px;margin-top:4px}
.navbtn{background:none;border:0;color:var(--accent);font-size:30px;line-height:1;padding:0 10px 4px;margin-left:-10px}
.navbtn+.mesnome{margin-left:-6px}
.navbtn:disabled{opacity:.3}
.mesnome{font-size:17px;font-weight:600;min-width:8.6em;text-align:center}
.link{background:none;border:0;color:var(--accent);font-size:17px;padding:8px 0}
.link.b{font-weight:600}
.link.small{font-size:15px;margin-left:auto;padding:4px 0}
.link:disabled{opacity:.4}

main{max-width:640px;margin:0 auto;padding:0 16px calc(104px + env(safe-area-inset-bottom))}

/* Secções agrupadas, estilo iOS */
.glabel{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.3px;margin:22px 16px 7px}
main > .glabel:first-child,main > section:first-child .glabel{margin-top:8px}
.group{background:var(--card);border-radius:12px;overflow:hidden}
.grow{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:46px;padding:6px 16px;border-bottom:.5px solid var(--line)}
.grow:last-child{border-bottom:0}
.glab{flex:none}
.gval{color:var(--muted);text-align:right}
.gval.strong{color:var(--text);font-weight:600}
.ginput{flex:1;min-width:0;border:0;background:transparent;color:var(--text);font-size:17px;text-align:right;padding:8px 0}
.ginput:focus{outline:none}
.ginput::placeholder{color:var(--muted);opacity:.7}
.pad{padding:12px 16px}
.hint{font-size:13px;color:var(--muted);margin:7px 16px 0;line-height:1.4}
.hint.warn{color:var(--warn-text)}
.hint.center{text-align:center;margin:0 0 14px}
.empty{text-align:center;color:var(--muted);margin:48px 16px}

/* Destaques */
.hero{padding:14px 16px 16px}
.hero .k{font-size:15px;color:var(--muted)}
.big{font-size:36px;font-weight:700;letter-spacing:-.5px;margin-top:2px;font-variant-numeric:tabular-nums}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.duo .big{font-size:26px}
.pos{color:var(--pos)}
.neg{color:var(--neg)}
.pill{display:inline-block;margin-top:10px;padding:4px 10px;border-radius:12px;font-size:13px;font-weight:600}
.pill.warn{background:var(--warn-bg);color:var(--warn-text)}

/* Linhas de lista */
.lrow{display:flex;align-items:center;gap:12px;width:100%;padding:10px 16px;background:none;border:0;
  border-bottom:.5px solid var(--line);text-align:left;color:inherit;font:inherit}
.lrow:last-child{border-bottom:0}
.lrow:active{background:var(--press)}
.lrow.off{opacity:.5}
.rmain{flex:1;min-width:0}
.rtitle{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rsub{font-size:13px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rsub.warn{color:var(--warn-text)}
.rval{font-weight:600;white-space:nowrap;font-variant-numeric:tabular-nums}
.chev{color:var(--muted);opacity:.5;font-size:20px;margin-left:-4px}

.catrow{padding:10px 16px;border-bottom:.5px solid var(--line)}
.catrow:last-child{border-bottom:0}
.cattop{display:flex;justify-content:space-between;gap:12px}
.bar{height:6px;border-radius:3px;background:var(--bar);margin-top:7px;min-width:4px}

/* Controlos */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;margin:8px -16px 0;padding:0 16px 2px;scrollbar-width:none}
.chips.scroll::-webkit-scrollbar{display:none}
.chip{flex:none;padding:7px 13px;border-radius:17px;background:var(--chip);border:0;font-size:15px;color:var(--text)}
.chip.on{background:var(--accent);color:#fff}
.switch{-webkit-appearance:none;appearance:none;width:51px;height:31px;border-radius:16px;background:var(--chip);position:relative;flex:none;margin:0;transition:background .2s}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.25);transition:transform .2s}
.switch:checked{background:#34c759}
.switch:checked::after{transform:translateX(20px)}
.seg{display:inline-flex;background:var(--chip);border-radius:9px;padding:2px}
.seg button{border:0;background:transparent;padding:6px 18px;border-radius:7px;font-size:15px;color:var(--text)}
.seg button.on{background:var(--segon);box-shadow:0 1px 3px rgba(0,0,0,.15);font-weight:600}
.btn{display:block;width:100%;padding:14px;border-radius:12px;border:0;font-size:17px;font-weight:600;margin:12px 0 0}
.btn.primary{background:var(--accent);color:#fff}
.btn.ghost{background:var(--card);color:var(--accent)}
.btn.danger{background:var(--card);color:var(--neg);margin-top:22px}
.btn:disabled{opacity:.45}
.valorin{display:block;width:100%;font-size:46px;font-weight:700;text-align:center;border:0;background:transparent;color:var(--text);padding:8px 0 2px;font-variant-numeric:tabular-nums}
.valorin:focus{outline:none}
.valorin::placeholder{color:var(--muted);opacity:.45}
.split{text-align:center;color:var(--muted);font-size:15px;margin:0 0 16px;font-variant-numeric:tabular-nums}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
ol.steps{margin:0;padding:12px 16px 12px 36px;font-size:15px;line-height:1.45}
ol.steps li{margin:0 0 7px}
ol.steps li:last-child{margin:0}
ol.steps b{font-weight:600}

/* Barra de separadores */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:10;display:grid;grid-template-columns:repeat(5,1fr);
  padding:6px 0 calc(env(safe-area-inset-bottom) + 4px);border-top:.5px solid var(--line);
  background:color-mix(in srgb,var(--card) 88%,transparent);
  -webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px)}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;font-weight:500;color:var(--muted);background:none;border:0;padding:3px 0}
.tab svg{width:26px;height:26px}
.tab.on{color:var(--accent)}
.toprow{display:flex;align-items:center;justify-content:space-between;gap:12px}
.addbtn{flex:none;width:38px;height:38px;border-radius:19px;border:0;background:var(--accent);color:#fff;font-size:26px;line-height:38px;padding:0 0 2px;box-shadow:0 2px 8px rgba(10,108,255,.3)}
.addbtn:active{opacity:.7}

/* Folha (bottom sheet) */
.backdrop{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.38);display:flex;align-items:flex-end;animation:fade .18s ease-out}
.sheet{width:100%;max-width:640px;margin:0 auto;max-height:92dvh;overflow-y:auto;-webkit-overflow-scrolling:touch;background:var(--bg);
  border-radius:14px 14px 0 0;padding:6px 16px calc(env(safe-area-inset-bottom) + 20px);animation:up .24s cubic-bezier(.2,.8,.2,1)}
.grab{width:36px;height:5px;border-radius:3px;background:var(--line);margin:2px auto 4px}
.snav{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;margin-bottom:4px}
.snav .link:first-child{justify-self:start}
.snav .r{justify-self:end}
.stitle{font-weight:600}
.sheet .group{margin-bottom:18px}
.sheet .glabel{margin-top:0}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}

/* Entrada */
.login{max-width:380px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 16vh) 24px 40px;display:flex;flex-direction:column;gap:12px}
.login h1{font-size:30px;margin:6px 0 0}
.login p{margin:0 0 14px;color:var(--muted)}
.logo{width:72px;height:72px;border-radius:18px;background:var(--accent);color:#fff;font-weight:800;font-size:23px;letter-spacing:.5px;display:grid;place-items:center}
.lfield{font-size:17px;padding:14px 16px;border-radius:12px;border:0;background:var(--card);color:var(--text)}
.lfield:focus{outline:2px solid var(--accent)}

#toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));z-index:60;transform:translate(-50%,16px);
  max-width:calc(100% - 32px);padding:10px 16px;border-radius:20px;background:rgba(28,28,30,.94);color:#fff;font-size:15px;
  opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
#toast.bad{background:#c42b21}
</style>
</head>
<body>
<div id="app"><p class="empty">A abrir…</p></div>
<div id="toast" role="status" aria-live="polite"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js"></script>
<script>
(function () {
'use strict';

// ===================== Configuração =====================
const SUPABASE_URL = 'https://klmjdjhvsxvopctgmhyu.supabase.co';
const SUPABASE_KEY = 'sb_publishable_L3QfJtwa_wYBCsHN4uzgXQ_rcp52nL8';
const VERSAO = 'v1.1 · nov 2026';
const CATEGORIAS = ['Casa', 'Supermercado', 'Restauração', 'Transportes', 'Saúde', 'Lazer', 'Compras', 'Subscrições', 'Outros'];
const TITULOS = { mes: 'Resumo', despesas: 'Despesas', calcular: 'Calcular', fixas: 'Fixas', ajustes: 'Ajustes' };

const app = document.getElementById('app');
if (!window.supabase || !window.supabase.createClient) {
  app.textContent = 'Não foi possível carregar a ligação ao servidor. Verifica a internet e abre outra vez.';
  return;
}
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
  auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: false, storageKey: 'gpp-dashboard-auth' }
});

const S = {
  user: null, config: null, tab: 'mes', mes: null, filtro: 'todas', loading: false, seq: 0,
  despesas: [], rend: { eu: null, ela: null }, prop: null, divisao: null, proximos: [], fixas: [],
  calc: { init: false, eu: '', ela: '', valor: '' }
};

// ===================== Utilitários =====================
function h(tag, props) {
  const el = document.createElement(tag);
  if (props) {
    for (const k of Object.keys(props)) {
      const v = props[k];
      if (v == null || v === false) continue;
      if (k === 'class') el.className = v;
      else if (k === 'text') el.textContent = v;
      else if (k === 'value') el.value = v;
      else if (k.slice(0, 2) === 'on' && typeof v === 'function') el.addEventListener(k.slice(2), v);
      else if (typeof v === 'boolean' && k in el) el[k] = v;
      else el.setAttribute(k, v === true ? '' : String(v));
    }
  }
  for (let i = 2; i < arguments.length; i++) append(el, arguments[i]);
  return el;
}
function append(el, kid) {
  if (kid == null || kid === false) return;
  if (Array.isArray(kid)) { kid.forEach(k => append(el, k)); return; }
  el.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
}
const SVGNS = 'http://www.w3.org/2000/svg';
const ICONS = {
  mes: ['M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z'],
  despesas: ['M9 6h11', 'M9 12h11', 'M9 18h11', 'M4.5 6h.01', 'M4.5 12h.01', 'M4.5 18h.01'],
  calcular: ['M7 3h10a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z', 'M8.5 7.5h7', 'M9 12h.01', 'M12 12h.01', 'M15 12h.01', 'M9 16h.01', 'M12 16h.01', 'M15 16h.01'],
  fixas: ['M17 2l4 4-4 4', 'M3 11V9a3 3 0 0 1 3-3h15', 'M7 22l-4-4 4-4', 'M21 13v2a3 3 0 0 1-3 3H3'],
  ajustes: ['M4 21v-7', 'M4 10V3', 'M12 21v-9', 'M12 8V3', 'M20 21v-5', 'M20 12V3', 'M1 14h6', 'M9 8h6', 'M17 16h6']
};
function icon(paths) {
  const s = document.createElementNS(SVGNS, 'svg');
  const at = { viewBox: '0 0 24 24', fill: 'none', stroke: 'currentColor', 'stroke-width': '1.9', 'stroke-linecap': 'round', 'stroke-linejoin': 'round', 'aria-hidden': 'true' };
  Object.keys(at).forEach(k => s.setAttribute(k, at[k]));
  paths.forEach(d => { const p = document.createElementNS(SVGNS, 'path'); p.setAttribute('d', d); s.append(p); });
  return s;
}

const EUR = new Intl.NumberFormat('pt-PT', { style: 'currency', currency: 'EUR' });
const fmt = v => EUR.format(Number(v) || 0);
const r2 = x => Math.round((Number(x) + Number.EPSILON) * 100) / 100;
const ok = n => typeof n === 'number' && isFinite(n);
const pctTxt = n => String(Math.round(n * 10) / 10).replace('.', ',') + '%';
function parseNum(s) {
  if (s == null) return null;
  let t = String(s).replace(/[^0-9,.\-]/g, '');
  if (!t) return null;
  if (/,\d{1,2}$/.test(t)) t = t.replace(/\./g, '').replace(',', '.');
  else t = t.replace(/,/g, '');
  const n = Number(t);
  return ok(n) ? r2(n) : NaN;
}
const toInput = v => (v == null || v === '') ? '' : Number(v).toFixed(2).replace('.', ',');
const pad2 = n => String(n).padStart(2, '0');
const iso = d => d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
const hojeISO = () => iso(new Date());
const mesAtual = () => hojeISO().slice(0, 8) + '01';
function addMes(m, n) { const [y, mo] = m.split('-').map(Number); return iso(new Date(y, mo - 1 + n, 1)); }
function ultimoDia(m) { const [y, mo] = m.split('-').map(Number); return new Date(y, mo, 0).getDate(); }
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
function nomeMes(m) {
  const [y, mo] = m.split('-').map(Number);
  return cap(new Intl.DateTimeFormat('pt-PT', { month: 'long' }).format(new Date(y, mo - 1, 1))) + ' ' + y;
}
function diaLongo(d) {
  const [y, mo, da] = d.split('-').map(Number);
  const t = new Intl.DateTimeFormat('pt-PT', { weekday: 'long', day: 'numeric', month: 'long' }).format(new Date(y, mo - 1, da));
  return (d === hojeISO() ? 'Hoje · ' : '') + t;
}
function diaCurto(d) {
  if (d === hojeISO()) return 'Hoje';
  const [y, mo, da] = d.split('-').map(Number);
  return da + ' ' + new Intl.DateTimeFormat('pt-PT', { month: 'short' }).format(new Date(y, mo - 1, da)).replace('.', '');
}
function dividirLocal(v, a, b) {
  const t = a + b;
  if (!(t > 0) || !(v > 0)) return null;
  const eu = r2(v * a / t);
  return { eu: eu, ela: r2(v - eu), pct: a / t * 100 };
}
const nomeEla = () => ((S.config && S.config.nome_ela) || '').trim();
const ELA = () => nomeEla() || 'Ela';
const DELA = () => nomeEla() ? 'da ' + nomeEla() : 'dela';

let toastT;
function toast(msg, bad) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'show' + (bad ? ' bad' : '');
  clearTimeout(toastT);
  toastT = setTimeout(() => { t.className = ''; }, 2800);
}
function traduzErro(e) {
  const m = (e && (e.message || e.error_description || e.msg)) || String(e);
  if (/invalid login credentials/i.test(m)) return 'Email ou palavra-passe errados.';
  if (/email not confirmed/i.test(m)) return 'Conta por confirmar. Confirma o utilizador no Supabase.';
  if (/failed to fetch|networkerror|load failed|network request failed/i.test(m)) return 'Sem ligação. Tenta outra vez.';
  if (/jwt|session|refresh token/i.test(m)) return 'A sessão expirou. Entra outra vez.';
  return 'Erro: ' + m;
}
function erro(e) { console.error(e); toast(traduzErro(e), true); }
async function q(p) { const r = await p; if (r.error) throw r.error; return r.data; }

function copiar(txt) {
  const fallback = () => {
    const ta = h('textarea', { style: 'position:fixed;top:-100px;opacity:0' });
    ta.value = txt; document.body.append(ta); ta.select();
    try { document.execCommand('copy'); toast('Copiado'); } catch (e) { toast('Não deu para copiar', true); }
    ta.remove();
  };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(() => toast('Copiado'), fallback);
  else fallback();
}

// Blocos de interface
const group = (...rows) => h('div', { class: 'group' }, rows);
const grow = (label, control) => h('div', { class: 'grow' }, typeof label === 'string' ? h('span', { class: 'glab', text: label }) : label, control);
const kv = (k, v, cls) => grow(k, h('span', { class: 'gval num' + (cls ? ' ' + cls : ''), text: v }));
const glabel = t => h('div', { class: 'glabel', text: t });
const hint = (t, cls) => h('p', { class: 'hint' + (cls ? ' ' + cls : ''), text: t });

function inputValor(valor, onSave, label) {
  const i = h('input', { class: 'ginput num', type: 'text', inputmode: 'decimal', placeholder: '0,00', value: toInput(valor), 'aria-label': label });
  i.addEventListener('keydown', e => { if (e.key === 'Enter') i.blur(); });
  i.addEventListener('change', () => {
    const v = parseNum(i.value);
    if (v !== null && (isNaN(v) || v < 0)) { toast('Valor inválido.', true); i.value = toInput(valor); return; }
    onSave(v);
  });
  return i;
}
function chipsCategoria(st) {
  const box = h('div', { class: 'chips' });
  const draw = () => box.replaceChildren(...CATEGORIAS.map(c => h('button', {
    type: 'button', class: 'chip' + (st.categoria === c ? ' on' : ''), text: c,
    onclick: () => { st.categoria = st.categoria === c ? null : c; draw(); }
  })));
  draw();
  return box;
}
function segPagoPor(st, onChange) {
  const box = h('div', { class: 'seg', role: 'group', 'aria-label': 'Pago por' });
  const draw = () => box.replaceChildren(...[['eu', 'Eu'], ['ela', ELA()]].map(([v, l]) => h('button', {
    type: 'button', class: st.pago_por === v ? 'on' : '', text: l, 'aria-pressed': String(st.pago_por === v),
    onclick: () => { st.pago_por = v; draw(); if (onChange) onChange(); }
  })));
  draw();
  return { el: box, draw: draw };
}
function botaoApagar(rotulo, acao) {
  let armado = false, t;
  const b = h('button', { type: 'button', class: 'btn danger', text: rotulo });
  b.addEventListener('click', async () => {
    if (!armado) {
      armado = true; b.textContent = 'Toca outra vez para apagar';
      t = setTimeout(() => { armado = false; b.textContent = rotulo; }, 3000);
      return;
    }
    clearTimeout(t); b.disabled = true;
    try { await acao(); } catch (e) { erro(e); b.disabled = false; }
  });
  return b;
}

function sheet(titulo, conteudo, onSave) {
  const back = h('div', { class: 'backdrop' });
  const guardar = h('button', { class: 'link b', type: 'button', text: 'Guardar' });
  function fechar() { back.remove(); document.body.classList.remove('noscroll'); }
  const panel = h('div', { class: 'sheet', role: 'dialog', 'aria-modal': 'true', 'aria-label': titulo },
    h('div', { class: 'grab' }),
    h('div', { class: 'snav' },
      h('button', { class: 'link', type: 'button', text: 'Cancelar', onclick: fechar }),
      h('div', { class: 'stitle', text: titulo }),
      h('div', { class: 'r' }, guardar)),
    conteudo);
  back.append(panel);
  back.addEventListener('click', e => { if (e.target === back) fechar(); });
  guardar.addEventListener('click', async () => {
    guardar.disabled = true;
    try { const r = await onSave(); if (r !== false) fechar(); }
    catch (e) { erro(e); }
    finally { guardar.disabled = false; }
  });
  document.body.append(back);
  document.body.classList.add('noscroll');
  return { fechar: fechar };
}

// ===================== Dados =====================
async function carregarMes() {
  const m = S.mes, seq = ++S.seq;
  S.loading = true;
  try {
    if (m <= mesAtual()) await q(sb.rpc('gerar_recorrentes', { p_mes: m }));
    const res = await Promise.all([
      q(sb.from('despesas').select('*').eq('mes', m).order('data', { ascending: false }).order('id', { ascending: false })),
      q(sb.from('rendimentos').select('pessoa,valor_liquido').eq('mes', m)),
      q(sb.rpc('proporcao_do_mes', { p_mes: m })),
      q(sb.from('divisao_mensal').select('*').eq('mes', m)),
      q(sb.from('proximos_pagamentos').select('*').order('data_vencimento').limit(5))
    ]);
    if (seq !== S.seq) return;
    S.despesas = res[0] || [];
    S.rend = { eu: null, ela: null };
    (res[1] || []).forEach(r => { S.rend[r.pessoa] = Number(r.valor_liquido); });
    S.prop = (res[2] && res[2][0]) || null;
    S.divisao = (res[3] && res[3][0]) || null;
    S.proximos = res[4] || [];
  } catch (e) { if (seq === S.seq) erro(e); }
  finally { if (seq === S.seq) S.loading = false; }
}
async function carregarFixas() {
  try {
    S.fixas = await q(sb.from('despesas_recorrentes').select('*').order('ativa', { ascending: false }).order('dia_vencimento').order('nome'));
  } catch (e) { erro(e); }
}
async function recarregar() { await carregarMes(); render(); }

async function guardarRendimento(pessoa, v) {
  try {
    await q(sb.rpc('definir_rendimento', { p_mes: S.mes, p_pessoa: pessoa, p_valor: v }));
    S.calc.init = false;
    await recarregar();
    toast(v == null ? 'Rendimento removido' : 'Rendimento guardado');
  } catch (e) { erro(e); }
}
async function guardarConfig(campos) {
  try {
    await q(sb.from('config').update(campos).eq('owner', S.user.id));
    Object.assign(S.config, campos);
    render();
    toast('Guardado');
  } catch (e) { erro(e); }
}

function viewMes() {
  if (S.loading && !S.despesas.length) return [h('p', { class: 'empty', text: 'A carregar…' })];
  const p = S.prop, d = S.divisao, out = [];

  // Acerto
  const saldo = d && d.saldo != null ? Number(d.saldo) : null;
  let k, big = null, cls = '';
  if (!d) k = 'Sem despesas partilhadas este mês';
  else if (saldo == null) k = 'Insere os rendimentos para calcular o acerto';
  else if (Math.abs(saldo) < 0.005) k = 'Estão quites';
  else if (saldo > 0) { k = ELA() + ' deve-te'; big = fmt(saldo); cls = 'pos'; }
  else { k = nomeEla() ? 'Deves à ' + nomeEla() : 'Deves-lhe'; big = fmt(-saldo); cls = 'neg'; }
  out.push(glabel('Acerto do mês'), group(
    h('div', { class: 'hero' },
      h('div', { class: 'k', text: k }),
      big ? h('div', { class: 'big ' + cls, text: big }) : null,
      d && d.provisoria ? h('div', { class: 'pill warn', text: 'Provisório · a usar rendimentos de ' + nomeMes(d.mes_base).toLowerCase() }) : null),
    d ? kv('Despesas partilhadas', fmt(d.total_partilhadas)) : null,
    d && d.quota_eu != null ? kv('A tua parte · ' + pctTxt(Number(d.pct_eu)), fmt(d.quota_eu)) : null,
    d && d.quota_ela != null ? kv('Parte ' + DELA() + ' · ' + pctTxt(Number(d.pct_ela)), fmt(d.quota_ela)) : null,
    d ? kv('Pagaste', fmt(d.pago_eu)) : null,
    d ? kv(ELA() + ' pagou', fmt(d.pago_ela)) : null
  ));

  // Rendimentos
  let info;
  if (!p) info = hint('Insere os dois rendimentos líquidos para dividir as despesas partilhadas.', 'warn');
  else if (p.provisoria) info = hint('Falta um rendimento deste mês. Até lá, a divisão usa ' + nomeMes(p.mes_base).toLowerCase() + ' (' + pctTxt(p.fracao_eu * 100) + ' / ' + pctTxt(100 - p.fracao_eu * 100) + ').', 'warn');
  else info = hint('Pagas ' + pctTxt(p.fracao_eu * 100) + ' das despesas partilhadas; ' + ELA() + ' paga ' + pctTxt(100 - p.fracao_eu * 100) + '.');
  out.push(glabel('Rendimentos líquidos · ' + nomeMes(S.mes)), group(
    grow('Eu', inputValor(S.rend.eu, v => guardarRendimento('eu', v), 'O meu rendimento')),
    grow(ELA(), inputValor(S.rend.ela, v => guardarRendimento('ela', v), 'Rendimento ' + DELA()))
  ), info);

  // O teu mês
  const pessoais = r2(S.despesas.filter(x => !x.partilhada && x.pago_por === 'eu').reduce((a, x) => a + Number(x.valor), 0));
  const quota = d && d.quota_eu != null ? Number(d.quota_eu) : null;
  const temPartilhadaSemQuota = !!d && quota == null;
  const custo = r2(pessoais + (quota || 0));
  const aVencer = S.despesas.some(x => x.data > hojeISO());
  out.push(glabel('O teu mês'), group(
    kv('Rendimento líquido', S.rend.eu != null ? fmt(S.rend.eu) : '—'),
    kv('Gastos pessoais', fmt(pessoais)),
    kv('A tua parte das partilhadas', quota != null ? fmt(quota) : (temPartilhadaSemQuota ? '—' : fmt(0))),
    kv('Custo real', fmt(custo), 'strong'),
    S.rend.eu != null ? kv('Sobra', fmt(S.rend.eu - custo), (S.rend.eu - custo) >= 0 ? 'pos strong' : 'neg strong') : null
  ), aVencer ? hint('Inclui despesas fixas que ainda vencem este mês.') : null);

  // Por categoria (o teu custo: pessoais + a tua parte das partilhadas)
  const f = p ? Number(p.fracao_eu) : null, cats = {};
  S.despesas.forEach(x => {
    let v;
    if (x.partilhada) { if (f == null) return; v = Number(x.valor) * f; }
    else if (x.pago_por === 'eu') v = Number(x.valor);
    else return;
    const c = x.categoria || 'Sem categoria';
    cats[c] = (cats[c] || 0) + v;
  });
  const lista = Object.keys(cats).map(c => [c, cats[c]]).sort((a, b) => b[1] - a[1]);
  if (lista.length) {
    const max = lista[0][1] || 1;
    out.push(glabel('Para onde foi o teu dinheiro'), group(lista.map(([c, v]) => h('div', { class: 'catrow' },
      h('div', { class: 'cattop' }, h('span', { text: c }), h('span', { class: 'num gval', text: fmt(v) })),
      h('div', { class: 'bar', style: 'width:' + Math.max(2, Math.round(v / max * 100)) + '%' })))));
  }

  // Próximos pagamentos
  out.push(glabel('Próximos pagamentos'));
  if (S.proximos.length) {
    out.push(group(S.proximos.map(x => h('div', { class: 'lrow' },
      h('div', { class: 'rmain' }, h('div', { class: 'rtitle', text: x.nome }),
        h('div', { class: 'rsub', text: diaCurto(x.data_vencimento) + (x.partilhada ? ' · Partilhada' : ' · Pessoal') })),
      h('div', { class: 'rval', text: fmt(x.valor) })))));
  } else out.push(hint('Sem despesas fixas. Adiciona-as no separador Fixas.'));
  return out;
}

function abrirDespesa(x, preset) {
  const novo = !x; preset = preset || {};
  const st = {
    categoria: x ? x.categoria : null,
    partilhada: x ? !!x.partilhada : !!preset.partilhada,
    pago_por: x ? x.pago_por : 'eu'
  };
  const dataDefault = S.mes === mesAtual() ? hojeISO() : S.mes;
  const valor = h('input', { class: 'valorin', type: 'text', inputmode: 'decimal', placeholder: '0,00', 'aria-label': 'Valor',
    value: x ? toInput(x.valor) : (ok(preset.valor) ? toInput(preset.valor) : '') });
  const desc = h('input', { class: 'ginput', type: 'text', autocapitalize: 'sentences', 'aria-label': 'Descrição',
    placeholder: x && x.comerciante ? x.comerciante : 'Ex.: Jantar', value: x ? (x.descricao || '') : '' });
  const data = h('input', { class: 'ginput', type: 'date', value: x ? x.data : dataDefault, 'aria-label': 'Data' });
  const preview = h('div', { class: 'split' });
  const sw = h('input', { type: 'checkbox', class: 'switch', checked: st.partilhada, 'aria-label': 'Partilhada' });
  const seg = segPagoPor(st);
  const rowPago = grow('Pago por', seg.el);
  function drawShared() {
    rowPago.hidden = !st.partilhada;
    const v = parseNum(valor.value), p = S.prop;
    const s = st.partilhada && p && ok(v) ? dividirLocal(v, Number(p.rendimento_eu), Number(p.rendimento_ela)) : null;
    preview.hidden = !s;
    if (s) preview.textContent = 'Tu ' + fmt(s.eu) + ' · ' + ELA() + ' ' + fmt(s.ela);
  }
  sw.addEventListener('change', () => { st.partilhada = sw.checked; if (!st.partilhada) { st.pago_por = 'eu'; seg.draw(); } drawShared(); });
  valor.addEventListener('input', drawShared);
  drawShared();

  let origem = null;
  if (x && x.origem === 'apple_pay') origem = ['Apple Pay', x.cartao, x.comerciante].filter(Boolean).join(' · ');
  if (x && x.origem === 'recorrente') origem = 'Lançada a partir de uma despesa fixa';

  let s;
  const conteudo = [
    valor, preview,
    origem ? hint(origem, 'center') : null,
    group(grow('Descrição', desc), grow('Data', data)),
    glabel('Categoria'),
    group(h('div', { class: 'pad' }, chipsCategoria(st))),
    group(grow('Partilhada', sw), rowPago),
    x && x.origem === 'apple_pay' && x.comerciante ? h('p', { class: 'hint', style: 'margin-top:-10px', text: 'A categoria e a partilha ficam memorizadas para «' + x.comerciante + '».' }) : null,
    novo ? null : botaoApagar('Apagar despesa', async () => {
      await q(sb.from('despesas').delete().eq('id', x.id));
      s.fechar(); await recarregar(); toast('Despesa apagada');
    })
  ];
  s = sheet(novo ? 'Nova despesa' : 'Editar despesa', conteudo, async () => {
    const v = parseNum(valor.value);
    if (!ok(v) || v <= 0) { toast('Indica um valor maior que zero.', true); valor.focus(); return false; }
    if (!data.value) { toast('Indica a data.', true); return false; }
    const payload = {
      valor: v, descricao: desc.value.trim() || null, data: data.value, categoria: st.categoria,
      partilhada: st.partilhada, pago_por: st.partilhada ? st.pago_por : 'eu'
    };
    if (novo) await q(sb.from('despesas').insert(payload));
    else await q(sb.from('despesas').update(payload).eq('id', x.id));
    const mesDespesa = payload.data.slice(0, 8) + '01';
    await recarregar();
    toast(mesDespesa === S.mes ? 'Guardado' : 'Guardado em ' + nomeMes(mesDespesa));
  });
  if (novo && !ok(preset.valor)) setTimeout(() => valor.focus(), 260);
}

function abrirFixa(x) {
  const novo = !x;
  const st = {
    categoria: x ? x.categoria : null, partilhada: x ? !!x.partilhada : false,
    pago_por: x ? x.pago_por : 'eu', ativa: x ? !!x.ativa : true
  };
  const valor = h('input', { class: 'valorin', type: 'text', inputmode: 'decimal', placeholder: '0,00', 'aria-label': 'Valor mensal', value: x ? toInput(x.valor) : '' });
  const nome = h('input', { class: 'ginput', type: 'text', autocapitalize: 'sentences', placeholder: 'Ex.: Ginásio', 'aria-label': 'Nome', value: x ? x.nome : '' });
  const dia = h('input', { class: 'ginput num', type: 'text', inputmode: 'numeric', placeholder: '1 a 31', 'aria-label': 'Dia do pagamento', value: x ? String(x.dia_vencimento) : '' });
  const sw = h('input', { type: 'checkbox', class: 'switch', checked: st.partilhada, 'aria-label': 'Partilhada' });
  const seg = segPagoPor(st);
  const rowPago = grow('Pago por', seg.el);
  rowPago.hidden = !st.partilhada;
  sw.addEventListener('change', () => { st.partilhada = sw.checked; if (!st.partilhada) { st.pago_por = 'eu'; seg.draw(); } rowPago.hidden = !st.partilhada; });
  const swAtiva = h('input', { type: 'checkbox', class: 'switch', checked: st.ativa, 'aria-label': 'Ativa' });
  swAtiva.addEventListener('change', () => { st.ativa = swAtiva.checked; });

  let s;
  const conteudo = [
    valor, h('div', { class: 'split', text: 'por mês' }),
    group(grow('Nome', nome), grow('Dia do pagamento', dia)),
    glabel('Categoria'),
    group(h('div', { class: 'pad' }, chipsCategoria(st))),
    group(grow('Partilhada', sw), rowPago, novo ? null : grow('Ativa', swAtiva)),
    h('p', { class: 'hint', style: 'margin-top:-10px', text: 'Entra sozinha em Despesas todos os meses. Dia 31 passa para o último dia nos meses mais curtos.' }),
    novo ? null : botaoApagar('Apagar despesa fixa', async () => {
      await q(sb.from('despesas_recorrentes').delete().eq('id', x.id));
      s.fechar(); await carregarFixas(); await recarregar(); toast('Fixa apagada · os meses já lançados mantêm-se');
    })
  ];
  s = sheet(novo ? 'Nova despesa fixa' : 'Editar despesa fixa', conteudo, async () => {
    const v = parseNum(valor.value), d = parseInt(dia.value, 10), n = nome.value.trim();
    if (!n) { toast('Dá um nome à despesa.', true); nome.focus(); return false; }
    if (!ok(v) || v <= 0) { toast('Indica um valor maior que zero.', true); valor.focus(); return false; }
    if (!(d >= 1 && d <= 31)) { toast('O dia tem de ser entre 1 e 31.', true); dia.focus(); return false; }
    const payload = { nome: n, valor: v, dia_vencimento: d, categoria: st.categoria, partilhada: st.partilhada, pago_por: st.partilhada ? st.pago_por : 'eu', ativa: st.ativa };
    const m = mesAtual();
    if (novo) await q(sb.from('despesas_recorrentes').insert(payload));
    else {
      await q(sb.from('despesas_recorrentes').update(payload).eq('id', x.id));
      // Atualiza também o lançamento deste mês, se já existir
      await q(sb.from('despesas').update({
        valor: v, descricao: n, categoria: st.categoria, partilhada: payload.partilhada, pago_por: payload.pago_por,
        data: m.slice(0, 8) + pad2(Math.min(d, ultimoDia(m)))
      }).eq('recorrente_id', x.id).eq('mes', m));
    }
    await q(sb.rpc('gerar_recorrentes', { p_mes: m }));
    await carregarFixas();
    await recarregar();
    toast(novo ? 'Fixa criada · já entrou em ' + nomeMes(m).toLowerCase() : 'Fixa atualizada');
  });
  if (novo) setTimeout(() => valor.focus(), 260);
}

// ===================== Estrutura =====================
function mesNav() {
  const max = addMes(mesAtual(), 1);
  return h('div', { class: 'mesnav' },
    h('button', { class: 'navbtn', type: 'button', 'aria-label': 'Mês anterior', text: '‹', onclick: () => mudarMes(-1) }),
    h('span', { class: 'mesnome', text: nomeMes(S.mes) }),
    h('button', { class: 'navbtn', type: 'button', 'aria-label': 'Mês seguinte', text: '›', disabled: S.mes >= max, onclick: () => mudarMes(1) }),
    S.mes !== mesAtual() ? h('button', { class: 'link small', type: 'button', text: 'Este mês', onclick: () => { S.mes = mesAtual(); S.despesas = []; render(); recarregar(); } }) : null);
}
async function mudarMes(n) {
  S.mes = addMes(S.mes, n);
  S.despesas = []; S.divisao = null; S.prop = null; S.rend = { eu: null, ela: null }; S.calc.init = false;
  render();
  await recarregar();
}
function irPara(t) {
  S.tab = t;
  window.scrollTo(0, 0);
  render();
  if (t === 'fixas') carregarFixas().then(render);
}
function render() {
  if (!S.user) return;
  const views = { mes: viewMes, despesas: viewDespesas, calcular: viewCalcular, fixas: viewFixas, ajustes: viewAjustes };
  const add = ['mes', 'despesas', 'fixas'].indexOf(S.tab) >= 0 ? h('button', {
    class: 'addbtn', type: 'button', text: '+', 'aria-label': S.tab === 'fixas' ? 'Nova despesa fixa' : 'Nova despesa',
    onclick: () => (S.tab === 'fixas' ? abrirFixa() : abrirDespesa())
  }) : null;
  const header = h('header', { class: 'top' },
    h('div', { class: 'toprow' }, h('h1', { text: TITULOS[S.tab] }), add),
    (S.tab === 'mes' || S.tab === 'despesas') ? mesNav() : null);
  const main = h('main', null, views[S.tab]());
  const tabbar = h('nav', { class: 'tabbar', 'aria-label': 'Separadores' }, Object.keys(TITULOS).map(t => h('button', {
    type: 'button', class: 'tab' + (S.tab === t ? ' on' : ''), 'aria-current': S.tab === t ? 'page' : null, onclick: () => irPara(t)
  }, icon(ICONS[t]), h('span', { text: TITULOS[t] }))));
  app.replaceChildren(header, main, tabbar);
}

function renderLogin() {
  document.querySelectorAll('.backdrop').forEach(b => b.remove());
  document.body.classList.remove('noscroll');
  const email = h('input', { class: 'lfield', type: 'email', autocomplete: 'username', autocapitalize: 'none', placeholder: 'Email', 'aria-label': 'Email', required: true });
  const pass = h('input', { class: 'lfield', type: 'password', autocomplete: 'current-password', placeholder: 'Palavra-passe', 'aria-label': 'Palavra-passe', required: true });
  const btn = h('button', { class: 'btn primary', type: 'submit', text: 'Entrar' });
  const form = h('form', { class: 'login' },
    h('div', { class: 'logo', text: 'GPP' }), h('h1', { text: 'GPP Dashboard' }), h('p', { text: 'As tuas finanças, num só sítio.' }),
    email, pass, btn);
  form.addEventListener('submit', async e => {
    e.preventDefault();
    btn.disabled = true; btn.textContent = 'A entrar…';
    const r = await sb.auth.signInWithPassword({ email: email.value.trim(), password: pass.value });
    btn.disabled = false; btn.textContent = 'Entrar';
    if (r.error) { erro(r.error); return; }
    await entrar(r.data.user);
  });
  app.replaceChildren(form);
}

async function entrar(user) {
  S.user = user;
  S.mes = mesAtual();
  S.tab = 'mes';
  S.despesas = [];
  app.replaceChildren(h('p', { class: 'empty', text: 'A carregar…' }));
  try { S.config = await q(sb.rpc('garantir_config')); }
  catch (e) { erro(e); S.config = {}; }
  render();
  await Promise.all([carregarMes(), carregarFixas()]);
  render();
}

sb.auth.onAuthStateChange(ev => {
  if (ev === 'SIGNED_OUT') {
    S.user = null; S.config = null; S.despesas = []; S.fixas = []; S.calc = { init: false, eu: '', ela: '', valor: '' };
    setTimeout(renderLogin, 0);
  }
});

// Ao voltar à app (ex.: depois de pagar com Apple Pay), atualiza
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && S.user && S.mes) recarregar();
});

(async function init() {
  try {
    const r = await sb.auth.getSession();
    const session = r.data && r.data.session;
    if (session) await entrar(session.user); else renderLogin();
  } catch (e) { erro(e); renderLogin(); }
})();
})();
</script>
</body>
